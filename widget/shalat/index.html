<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Widget Shalat</title>

<link rel="manifest" href="/manifest.json">

<style>
html,body{
  margin:0;
  height:100%;
  background:#043b47;
  font-family:system-ui;
  color:white;
}

.wrap{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100%;
  text-align:center;
}

h1{
  font-size:22px;
  margin:0;
}

.time{
  font-size:34px;
  font-weight:bold;
  margin:6px 0;
}

.city{
  opacity:.8;
  font-size:13px;
}

.countdown{
  margin-top:10px;
  font-size:14px;
  opacity:.9;
}

.lock{
  font-size:14px;
  opacity:.8;
}
</style>
</head>

<body>

<div class="wrap" id="app">
  <div>⏳ memuat...</div>
</div>

<script>
const API="https://noorrahma-app.pembang001.workers.dev";

const app=document.getElementById("app");

let uid=localStorage.getItem("nr_uid");

async function main(){

  if(!uid){
    app.innerHTML=
      `<div class="lock">❌ UID tidak ditemukan</div>`;
    return;
  }

  const pro=await fetch(
    API+"/pro-status?uid="+uid
  ).then(r=>r.json()).catch(()=>null);

  if(!pro?.pro){
    app.innerHTML=
      `<div class="lock">🔒 Widget hanya untuk PRO</div>`;
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos=>loadPrayer(pos.coords),
    ()=>app.innerHTML=`<div class="lock">📍 GPS dibutuhkan</div>`
  );
}

async function loadPrayer(coords){

  const r=await fetch(
    `https://api.aladhan.com/v1/timings?latitude=${coords.latitude}&longitude=${coords.longitude}&method=11`
  );

  const j=await r.json();

  const times=j.data.timings;

  renderNext(times,j.data.meta.timezone);
}

function renderNext(times){

  const now=new Date();

  const order=[
    ["Fajr","Subuh"],
    ["Dhuhr","Dzuhur"],
    ["Asr","Ashar"],
    ["Maghrib","Maghrib"],
    ["Isha","Isya"]
  ];

  let next=null;

  for(const [k,label] of order){

    const [h,m]=times[k].split(":");

    const d=new Date();
    d.setHours(h);
    d.setMinutes(m);
    d.setSeconds(0);

    if(d>now){
      next={label,time:times[k]};
      break;
    }
  }

  if(!next){
    app.innerHTML="<div>🌙 Shalat selesai hari ini</div>";
    return;
  }

  app.innerHTML=`
    <h1>${next.label}</h1>
    <div class="time">${next.time}</div>
    <div class="countdown" id="cd"></div>
  `;

  startCountdown(next.time);
}

function startCountdown(t){

  const [h,m]=t.split(":");

  const target=new Date();
  target.setHours(h);
  target.setMinutes(m);
  target.setSeconds(0);

  setInterval(()=>{
    const diff=target-new Date();

    if(diff<=0) return;

    const min=Math.floor(diff/60000);
    const sec=Math.floor((diff%60000)/1000);

    document.getElementById("cd").textContent=
      `⏳ ${min}m ${sec}s`;
  },1000);
}

main();
</script>

</body>
</html>
