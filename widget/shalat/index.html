<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>NoorRahma — Widget Shalat</title>

<link rel="manifest" href="manifest.json">

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#08121f;
  color:white;
}

.card{
  margin:12px;
  padding:16px;
  border-radius:18px;
  background:linear-gradient(135deg,#0f9d77,#0b6);
}

.city{font-size:14px;opacity:.9}
.time{font-size:40px;font-weight:700}
.prayer{font-size:18px;margin-top:4px}
.count{font-size:13px;opacity:.85}

button{
  margin-top:14px;
  padding:10px 16px;
  border:none;
  border-radius:12px;
  background:#fff;
  color:#111;
}
</style>
</head>

<body>

<div class="card">
  <div class="city" id="city">Mendeteksi lokasi…</div>
  <div class="time" id="time">--:--</div>
  <div class="prayer" id="prayer">---</div>
  <div class="count" id="count"></div>

  <button onclick="reload()">Refresh</button>
</div>

<script>
const API = "https://noorrahma-app.pembang001.workers.dev";

let uid = localStorage.getItem("uid");

if(!uid){
  uid = prompt("Masukkan UID aplikasi:");
  if(uid) localStorage.setItem("uid",uid);
}

async function reload(){

  if(!uid) return;

  const pro = await fetch(
    API+"/pro-status?uid="+uid
  ).then(r=>r.json());

  if(!pro.pro){
    document.body.innerHTML =
      "<h2 style='padding:20px'>🚫 Widget hanya untuk akun PRO</h2>";
    return;
  }

  navigator.geolocation.getCurrentPosition(async pos=>{

    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    const res = await fetch(
      `https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lng}&method=11`
    );

    const data = await res.json();

    render(data.data);

  });

}

function render(d){

  const city =
    d.meta.timezone.replace("_"," ");

  const t = d.timings;

  document.getElementById("city").innerText = city;

  const now = new Date();

  const list = [
    ["Fajr",t.Fajr],
    ["Dhuhr",t.Dhuhr],
    ["Asr",t.Asr],
    ["Maghrib",t.Maghrib],
    ["Isha",t.Isha],
  ];

  for(const [name,val] of list){

    const [h,m]=val.split(":");
    const dt = new Date();
    dt.setHours(h,m,0);

    if(dt > now){
      show(name,val,dt-now);
      return;
    }
  }

}

function show(name,time,ms){

  document.getElementById("prayer").innerText =
    "Shalat berikutnya: "+name;

  document.getElementById("time").innerText = time;

  tick(ms);
}

function tick(ms){

  const el = document.getElementById("count");

  setInterval(()=>{
    ms-=1000;

    const h=Math.floor(ms/3600000);
    const m=Math.floor(ms/60000)%60;
    const s=Math.floor(ms/1000)%60;

    el.innerText=`${h}j ${m}m ${s}d`;

  },1000);

}

reload();
</script>

</body>
</html>
