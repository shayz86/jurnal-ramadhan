<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanya Ustadz AI - NoorRahma</title>

<style>
body{
  margin:0;
  background:#020617;
  color:white;
  font-family:system-ui;
}

/* ================= SIDEBAR ================= */

#sidebar{
  position:fixed;
  left:-270px;
  top:0;
  width:260px;
  height:100%;
  background:#0f172a;
  border-right:1px solid #1e293b;
  padding:15px;
  overflow-y:auto;
  transition:.3s;
  z-index:500;
}

#sidebar.show{ left:0; }

#overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  z-index:400;
}

#overlay.show{ display:block; }

.new-chat{
  background:#10b981;
  border:none;
  padding:10px;
  border-radius:8px;
  width:100%;
  margin-bottom:15px;
  font-weight:bold;
  cursor:pointer;
}

.chat-tab{
  background:#1e293b;
  padding:10px;
  border-radius:8px;
  margin-bottom:8px;
  font-size:13px;
  cursor:pointer;
}

.chat-tab.active{ background:#064e3b; }

/* ================= HEADER ================= */

header{
  padding:18px;
  text-align:center;
  font-weight:bold;
  font-size:18px;
  background:linear-gradient(to right,#059669,#0ea5e9);
  position:relative;
}

.toggle-btn{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  background:#10b981;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

/* ================= SETTINGS ================= */

.settings{
  display:flex;
  gap:10px;
  padding:10px 14px;
  overflow-x:auto;
}

.settings select,
.settings label{
  background:#0f172a;
  border:1px solid #334155;
  color:white;
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  cursor:pointer;
  white-space:nowrap;
}

.settings input{ accent-color:#10b981 }

/* ================= QUICK ================= */

.quick{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:10px 15px;
}

.quick button{
  background:#0f172a;
  border:1px solid #334155;
  color:white;
  padding:7px 14px;
  border-radius:999px;
  font-size:12px;
  cursor:pointer;
}

/* ================= CHAT ================= */

.chat{
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
  padding-bottom:220px;
}

.msg{
  max-width:85%;
  padding:12px 15px;
  border-radius:18px;
  font-size:14px;
  line-height:1.6;
}

.user{
  align-self:flex-end;
  background:#1e293b;
}

.ai{
  align-self:flex-start;
  background:#064e3b;
}

/* ================= INPUT ================= */

.input-box{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#020617;
  padding:12px;
  display:flex;
  gap:10px;
  border-top:1px solid #1e293b;
  z-index:600;
}

textarea{
  flex:1;
  resize:none;
  border-radius:14px;
  border:1px solid #334155;
  background:#020617;
  color:white;
  padding:10px;
  font-size:13px;
}

button{
  background:#10b981;
  border:none;
  padding:0 18px;
  border-radius:14px;
  color:black;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="overlay" onclick="toggleSidebar()"></div>

<div id="sidebar">
<button class="new-chat" onclick="newChat()">+ Chat Baru</button>
<h3>Riwayat Chat</h3>
<div id="chatTabs"></div>
</div>

<header>
<button class="toggle-btn" onclick="toggleSidebar()">☰</button>
🕌 Tanya Ustadz AI
<span style="font-size:11px;background:#facc15;color:black;padding:4px 10px;border-radius:999px;margin-left:6px;">PRO</span>
</header>

<div class="settings">
<select id="mode">
<option value="ai">Mode Konsultan</option>
<option value="fiqh">Mode Fiqh</option>
</select>

<select id="mazhab">
<option value="netral">Mazhab: Netral</option>
<option value="syafii">Syafi’i</option>
<option value="hanafi">Hanafi</option>
<option value="maliki">Maliki</option>
<option value="hanbali">Hanbali</option>
</select>

<select id="persona">
<option value="ilmiah">Ustadz Ilmiah</option>
<option value="santai">Santai</option>
<option value="remaja">Remaja Friendly</option>
<option value="tradisional">Tradisional</option>
</select>

<label><input type="checkbox" id="dalil" checked> Dalil</label>
<label><input type="checkbox" id="ringkas"> Ringkas</label>
<label><input type="checkbox" id="detail"> Detail</label>
</div>

<div class="quick">
<button onclick="askQuick('Apakah riba itu haram?')">Riba</button>
<button onclick="askQuick('Apa syarat sah shalat?')">Shalat</button>
<button onclick="askQuick('Apakah wudhu batal?')">Wudhu</button>
<button onclick="askQuick('Bagaimana zakat?')">Zakat</button>
</div>

<div class="chat" id="chat"></div>

<div class="input-box">
<textarea id="input" rows="2"
placeholder="Tanyakan masalah ibadah, muamalah, keluarga, dsb..."></textarea>
<button onclick="send()">Kirim</button>
</div>

<script>

/* ================= CORE CHAT ================= */

let allChats = JSON.parse(localStorage.getItem("nr_all_chats")||"[]");
let currentChatId = null;

function saveTabs(){
 localStorage.setItem("nr_all_chats",JSON.stringify(allChats));
}

function renderTabs(){
 const wrap=document.getElementById("chatTabs");
 wrap.innerHTML="";
 allChats.forEach(c=>{
   const d=document.createElement("div");
   d.className="chat-tab"+(c.id===currentChatId?" active":"");
   d.innerHTML=`${c.title}
   <span style="float:right;cursor:pointer" onclick="deleteChat('${c.id}',event)">✕</span>`;
   d.onclick=()=>loadChat(c.id);
   d.oncontextmenu=(e)=>{e.preventDefault();renameChat(c.id)};
   wrap.appendChild(d);
 });
}

function newChat(){
 const id="chat-"+Date.now();
 const data={id,title:"Chat Baru",messages:[]};
 allChats.unshift(data);
 currentChatId=id;
 saveTabs();
 renderTabs();
 loadChat(id);
}

function loadChat(id){
 currentChatId=id;
 document.getElementById("chat").innerHTML="";
 renderTabs();
 toggleSidebar(false);
}

function deleteChat(id,e){
 e.stopPropagation();
 allChats=allChats.filter(c=>c.id!==id);
 if(allChats.length===0)newChat();
 else loadChat(allChats[0].id);
 saveTabs();
 renderTabs();
}

function renameChat(id){
 const data=allChats.find(c=>c.id===id);
 const name=prompt("Rename chat:",data.title);
 if(!name)return;
 data.title=name;
 saveTabs();
 renderTabs();
}

function toggleSidebar(forceClose){
 const sb=document.getElementById("sidebar");
 const ov=document.getElementById("overlay");

 if(forceClose===false){
   sb.classList.remove("show");
   ov.classList.remove("show");
   return;
 }

 sb.classList.toggle("show");
 ov.classList.toggle("show");
}

/* ================= CHAT FUNCTION ================= */

function askQuick(text){
 document.getElementById("input").value=text;
 send();
}

function add(role,text){
 const chat=document.getElementById("chat");
 const d=document.createElement("div");
 d.className="msg "+(role==="user"?"user":"ai");
 d.innerHTML=text.replace(/\n/g,"<br>");
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
}

async function send(){
 const input=document.getElementById("input");
 const q=input.value.trim();
 if(!q)return;

 add("user",q);
 input.value="";

 const res=await fetch("https://noorrahma-app.pembang001.workers.dev/assistant/ai",{
  method:"POST",
  headers:{"content-type":"application/json"},
  body:JSON.stringify({prompt:q})
 });

 const d=await res.json();
 add("ai",d.answer||"Tidak ada jawaban.");
}

/* AUTO CHAT */
if(allChats.length===0)newChat();
else newChat();

renderTabs();

</script>

</body>
</html>
