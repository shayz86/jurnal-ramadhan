<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tanya Ustadz AI - NoorRahma</title>

<link rel="manifest" href="/manifest.json" />

<style>
body{
  margin:0;
  background:#020617;
  color:white;
  font-family:system-ui;
}

/* ===== HEADER ===== */

header{
  padding:18px;
  text-align:center;
  font-weight:bold;
  font-size:18px;
  background:linear-gradient(to right,#059669,#0ea5e9);
}

/* ===== SETTINGS ===== */

.settings{
  display:flex;
  gap:10px;
  padding:10px 14px;
  overflow-x:auto;
}

.settings select,
.settings label{
  background:#0f172a;
  border:1px solid #334155;
  color:white;
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  cursor:pointer;
  white-space:nowrap;
}

.settings input{
  accent-color:#10b981;
}

/* ===== CHAT ===== */

.chat{
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
  padding-bottom:150px;
}

.msg{
  max-width:85%;
  padding:12px 15px;
  border-radius:18px;
  font-size:14px;
  line-height:1.6;
  position:relative;
}

.user{
  align-self:flex-end;
  background:#1e293b;
}

.ai{
  align-self:flex-start;
  background:#064e3b;
}

/* ===== BOOKMARK BTN ===== */

.bookmark{
  position:absolute;
  right:10px;
  bottom:6px;
  font-size:13px;
  opacity:.7;
  cursor:pointer;
}

.bookmark.active{
  color:#facc15;
}

/* ===== QUICK ===== */

.quick{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:10px 15px;
}

.quick button{
  background:#0f172a;
  border:1px solid #334155;
  color:white;
  padding:7px 14px;
  border-radius:999px;
  font-size:12px;
  cursor:pointer;
}

/* ===== INPUT ===== */

.input-box{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#020617;
  padding:12px;
  display:flex;
  gap:10px;
  border-top:1px solid #1e293b;
}

.input-box textarea{
  flex:1;
  resize:none;
  border-radius:14px;
  border:1px solid #334155;
  background:#020617;
  color:white;
  padding:10px;
  font-size:13px;
}

.input-box button{
  background:#10b981;
  border:none;
  padding:0 18px;
  border-radius:14px;
  color:black;
  font-weight:bold;
}

/* ===== LOADING ===== */

.typing{
  font-size:13px;
  opacity:.7;
  animation:pulse 1.4s infinite;
}

@keyframes pulse{
  0%,100%{opacity:.3}
  50%{opacity:1}
}

/* ===== PRO BADGE ===== */

.badge{
  font-size:11px;
  background:#facc15;
  color:black;
  padding:4px 10px;
  border-radius:999px;
  margin-left:6px;
}
</style>
</head>

<body>

<header>
  🕌 Tanya Ustadz AI
  <span class="badge">PRO</span>
</header>

<div class="settings">

<select id="mode">
  <option value="ai">Mode Konsultan</option>
  <option value="fiqh">Mode Fiqh</option>
</select>

<select id="mazhab">
  <option value="netral">Mazhab: Netral</option>
  <option value="syafii">Syafi’i</option>
  <option value="hanafi">Hanafi</option>
  <option value="maliki">Maliki</option>
  <option value="hanbali">Hanbali</option>
</select>

<select id="persona">
  <option value="ilmiah">Ustadz Ilmiah</option>
  <option value="santai">Santai</option>
  <option value="remaja">Remaja Friendly</option>
  <option value="tradisional">Tradisional</option>
</select>

<label><input type="checkbox" id="dalil" checked> Dalil</label>
<label><input type="checkbox" id="ringkas"> Ringkas</label>
<label><input type="checkbox" id="detail"> Detail</label>

</div>

<div class="quick">
<button onclick="askQuick('Apakah riba itu haram?')">Riba</button>
<button onclick="askQuick('Apa syarat sah shalat?')">Sah Shalat</button>
<button onclick="askQuick('Apakah wudhu batal jika tidur?')">Wudhu</button>
<button onclick="askQuick('Bagaimana zakat fitrah?')">Zakat</button>
<button onclick="askQuick('Hukum hutang dalam Islam')">Hutang</button>
</div>

<div class="chat" id="chat"></div>

<div class="input-box">
<textarea id="input" rows="2"
 placeholder="Tanyakan masalah ibadah, muamalah, keluarga, dsb..."></textarea>
<button onclick="send()">Kirim</button>
</div>

<script>

/* ================= UID ================= */

let uid=localStorage.getItem("nr_uid");
if(!uid){
 uid="uid-"+Date.now();
 localStorage.setItem("nr_uid",uid);
}

/* ================= HISTORY ================= */

let history=
 JSON.parse(localStorage.getItem("nr_ustadz_history")||"[]");

const bookmarks=
 JSON.parse(localStorage.getItem("nr_ustadz_bookmarks")||"[]");

const chat=document.getElementById("chat");
const input=document.getElementById("input");

/* render history */
history.forEach(m=>add(m.role,m.text,m.bookmark));

/* ================= AUTO SWITCH ================= */

const fiqhWords=[
 "halal","haram","batal","sah","riba","najis",
 "wudhu","puasa","zakat","hutang","nikah","mahram"
];

function detectFiqh(t){
 return fiqhWords.some(w=>t.toLowerCase().includes(w));
}

/* ================= UI ================= */

function askQuick(t){
 input.value=t;
 send();
}

function add(role,text,bookmarked=false){

 const d=document.createElement("div");
 d.className="msg "+(role==="user"?"user":"ai");
 d.innerHTML=text.replace(/\n/g,"<br>");

 if(role==="ai"){

  const bm=document.createElement("div");
  bm.className="bookmark"+(bookmarked?" active":"");
  bm.textContent="❤️";

  bm.onclick=()=>toggleBookmark(text,bm);

  d.appendChild(bm);
 }

 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
}

/* ================= BOOKMARK ================= */

function toggleBookmark(text,el){

 let i=bookmarks.indexOf(text);

 if(i>-1){
  bookmarks.splice(i,1);
  el.classList.remove("active");
 }else{
  bookmarks.push(text);
  el.classList.add("active");
 }

 localStorage.setItem(
  "nr_ustadz_bookmarks",
  JSON.stringify(bookmarks)
 );
}

/* ================= SEND ================= */

async function send(){

 const q=input.value.trim();
 if(!q) return;

 const autoFiqh=detectFiqh(q);

 if(autoFiqh)
  document.getElementById("mode").value="fiqh";

 const mazhab=document.getElementById("mazhab").value;
 const persona=document.getElementById("persona").value;
 const dalil=document.getElementById("dalil").checked;
 const ringkas=document.getElementById("ringkas").checked;
 const detail=document.getElementById("detail").checked;
 const mode=document.getElementById("mode").value;

 const sysPrompt=
`Jawab sebagai ustadz muslim ${persona}.
Mazhab: ${mazhab}.
${dalil?"Sertakan ayat dan hadits.":""}
${ringkas?"Jawaban singkat.":""}
${detail?"Jawaban panjang dan terperinci.":""}`;

 let endpoint="/assistant/ai";
 let payload={
  uid,
  sessionId:Date.now().toString(),
  prompt: sysPrompt+"\n\nPERTANYAAN:\n"+q
 };

 if(mode==="fiqh"){
  endpoint="/assistant/fiqh";
  payload={
   uid,
   topic:"Fiqh",
   madhhab:mazhab,
   question:q
  };
 }

 add("user",q);
 history.push({role:"user",text:q});
 saveHistory();

 input.value="";

 const typing=document.createElement("div");
 typing.className="typing";
 typing.textContent="Ustadz AI sedang mengetik...";
 chat.appendChild(typing);

 const res=await fetch(
  "https://noorrahma-app.pembang001.workers.dev"+endpoint,
  {
   method:"POST",
   headers:{ "content-type":"application/json" },
   body:JSON.stringify(payload)
  }
 );

 typing.remove();

 const data=await res.json();

 const answer=data.answer||"⚠️ Tidak bisa menjawab.";

 add("ai",answer,bookmarks.includes(answer));

 history.push({role:"ai",text:answer});
 saveHistory();
}

/* ================= SAVE ================= */

function saveHistory(){
 localStorage.setItem(
  "nr_ustadz_history",
  JSON.stringify(history)
 );
}

</script>

</body>
</html>
