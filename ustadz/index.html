<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tanya Ustadz AI - NoorRahma</title>

<link rel="manifest" href="/manifest.json" />

<style>
body{
  margin:0;
  background:#020617;
  color:white;
  font-family:system-ui;
}

/* ===== HEADER ===== */

header{
  padding:18px;
  text-align:center;
  font-weight:bold;
  font-size:18px;
  background:linear-gradient(to right,#059669,#0ea5e9);
}

/* ===== SETTINGS ===== */

.settings{
  display:flex;
  gap:10px;
  padding:10px 14px;
  overflow-x:auto;
}

.settings select,
.settings label{
  background:#0f172a;
  border:1px solid #334155;
  color:white;
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  cursor:pointer;
  white-space:nowrap;
}

.settings input{
  accent-color:#10b981;
}

/* ===== CHAT ===== */

.chat{
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
  padding-bottom:210px;
}

.msg{
  max-width:85%;
  padding:12px 15px;
  border-radius:18px;
  font-size:14px;
  line-height:1.6;
  position:relative;
}

.user{
  align-self:flex-end;
  background:#1e293b;
}

.ai{
  align-self:flex-start;
  background:#064e3b;
}

/* ===== ACTION BTN ===== */

.actions{
  display:flex;
  gap:10px;
  margin-top:8px;
  font-size:12px;
  opacity:.85;
}

.actions span{
  cursor:pointer;
}

.bookmark.active{color:#facc15}

/* ===== QUICK ===== */

.quick{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:10px 15px;
}

.quick button{
  background:#0f172a;
  border:1px solid #334155;
  color:white;
  padding:7px 14px;
  border-radius:999px;
  font-size:12px;
  cursor:pointer;
}

/* ===== INPUT ===== */

.input-box{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#020617;
  padding:12px;
  display:flex;
  gap:10px;
  border-top:1px solid #1e293b;
}

.input-box textarea{
  flex:1;
  resize:none;
  border-radius:14px;
  border:1px solid #334155;
  background:#020617;
  color:white;
  padding:10px;
  font-size:13px;
}

.input-box button{
  background:#10b981;
  border:none;
  padding:0 18px;
  border-radius:14px;
  color:black;
  font-weight:bold;
}

/* ===== FAVORITE PANEL ===== */

#favPanel{
 position:fixed;
 inset:0;
 background:#020617;
 z-index:99;
 padding:20px;
 display:none;
 overflow:auto;
}

#favPanel h3{text-align:center}

.fav-item{
 background:#064e3b;
 padding:14px;
 border-radius:14px;
 margin-bottom:10px;
}

/* ===== PRO BADGE ===== */

.badge{
  font-size:11px;
  background:#facc15;
  color:black;
  padding:4px 10px;
  border-radius:999px;
  margin-left:6px;
}
</style>
</head>

<body>

<header>
 🕌 Tanya Ustadz AI
 <span class="badge">PRO</span>
 ⭐ <span onclick="openFav()">Fatwa Favorit</span>
</header>

<div id="favPanel">
<h3>⭐ Fatwa Favorit</h3>
<div id="favList"></div>
<button onclick="closeFav()">Tutup</button>
</div>

<div class="settings">

<select id="mode">
<option value="ai">Mode Konsultan</option>
<option value="fiqh">Mode Fiqh</option>
</select>

<select id="mazhab">
<option value="netral">Mazhab: Netral</option>
<option value="syafii">Syafi’i</option>
<option value="hanafi">Hanafi</option>
<option value="maliki">Maliki</option>
<option value="hanbali">Hanbali</option>
</select>

<select id="persona">
<option value="ilmiah">Ustadz Ilmiah</option>
<option value="santai">Santai</option>
<option value="remaja">Remaja Friendly</option>
<option value="tradisional">Tradisional</option>
</select>

<label><input type="checkbox" id="dalil" checked> Dalil</label>
<label><input type="checkbox" id="ringkas"> Ringkas</label>
<label><input type="checkbox" id="detail"> Detail</label>

</div>

<div class="quick">
<button onclick="askQuick('Apakah riba itu haram?')">Riba</button>
<button onclick="askQuick('Apa syarat sah shalat?')">Shalat</button>
<button onclick="askQuick('Apakah wudhu batal?')">Wudhu</button>
<button onclick="askQuick('Bagaimana zakat?')">Zakat</button>
</div>

<div class="chat" id="chat"></div>

<div class="input-box">
<textarea id="input" rows="2"
 placeholder="Tanyakan masalah ibadah, muamalah, keluarga, dsb..."></textarea>
<button onclick="send()">Kirim</button>
</div>

<script>

/* ================= UID ================= */

let uid=localStorage.getItem("nr_uid")||
 "uid-"+Date.now();

/* ================= DATA ================= */

let history=JSON.parse(localStorage.getItem("nr_ustadz_history")||"[]");
let bookmarks=JSON.parse(localStorage.getItem("nr_ustadz_bookmarks")||"[]");

const chat=document.getElementById("chat");
const input=document.getElementById("input");

history.forEach(m=>add(m.role,m.text));

/* ================= UI ================= */

function askQuick(t){input.value=t;send();}

function add(role,text){

 const d=document.createElement("div");
 d.className="msg "+(role==="user"?"user":"ai");
 d.innerHTML=text.replace(/\n/g,"<br>");

 if(role==="ai"){

 const actions=document.createElement("div");
 actions.className="actions";

 const bm=document.createElement("span");
 bm.textContent="⭐";
 bm.onclick=()=>toggleBookmark(text);

 const wa=document.createElement("span");
 wa.textContent="📤 WA";
 wa.onclick=()=>shareWA(text);

 actions.append(bm,wa);

 d.append(actions);
 }

 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
}

/* ================= SEND ================= */

async function send(){

 const q=input.value.trim();
 if(!q)return;

 add("user",q);
 history.push({role:"user",text:q});
 saveHistory();

 input.value="";

 const res=await fetch(
 "https://noorrahma-app.pembang001.workers.dev/assistant/ai",
 {
 method:"POST",
 headers:{"content-type":"application/json"},
 body:JSON.stringify({uid,prompt:q})
 });

 const d=await res.json();

 const ans=d.answer||"⚠️ Tidak bisa menjawab.";

 const withAyat=ans+"\n\n📖 Rekomendasi Ayat:\n• QS. Al-Baqarah\n• QS. An-Nisa";

 add("ai",withAyat);

 history.push({role:"ai",text:withAyat});
 saveHistory();
}

/* ================= FAVORITE ================= */

function toggleBookmark(t){

 if(bookmarks.includes(t))
 bookmarks=bookmarks.filter(x=>x!==t);
 else bookmarks.push(t);

 localStorage.setItem(
 "nr_ustadz_bookmarks",
 JSON.stringify(bookmarks)
 );
}

function openFav(){

 const list=document.getElementById("favList");
 list.innerHTML="";

 bookmarks.forEach(b=>{
 const d=document.createElement("div");
 d.className="fav-item";
 d.innerText=b;
 list.appendChild(d);
 });

 document.getElementById("favPanel").style.display="block";
}

function closeFav(){
 document.getElementById("favPanel").style.display="none";
}

/* ================= SHARE ================= */

function shareWA(t){
 window.open(
 "https://wa.me/?text="+encodeURIComponent(t)
 );
}

/* ================= SAVE ================= */

function saveHistory(){
 localStorage.setItem(
 "nr_ustadz_history",
 JSON.stringify(history)
 );
}

</script>

</body>
</html>
