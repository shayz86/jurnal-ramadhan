<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanya Ustadz AI - NoorRahma</title>

<style>
body{
  margin:0;
  background:#020617;
  color:white;
  font-family:system-ui;
}

  body.sidebar-open{
  overflow:hidden;
  }

/* ================= SIDEBAR ================= */

#sidebar{
  position:fixed;
  top:0;
  left:0;
  width:260px;
  height:100%;
  background:#0f172a;
  border-right:1px solid #1e293b;
  padding:15px;
  overflow-y:auto;
  transform:translateX(-100%);
  transition:transform .3s ease;
  z-index:500;
}

#sidebar.show{
  transform:translateX(0);
}
#overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  z-index:400;
}

#overlay.show{ display:block; }

.new-chat{
  background:#10b981;
  border:none;
  padding:10px;
  border-radius:8px;
  width:100%;
  margin-bottom:15px;
  font-weight:bold;
  cursor:pointer;
}

.chat-tab{
  background:#1e293b;
  padding:10px;
  border-radius:8px;
  margin-bottom:8px;
  font-size:13px;
  cursor:pointer;
}

.chat-tab.active{ background:#064e3b; }

/* ================= HEADER ================= */

header{
  padding:18px;
  text-align:center;
  font-weight:bold;
  font-size:18px;
  background:linear-gradient(to right,#059669,#0ea5e9);
  position:relative;
}

.toggle-btn{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  background:#10b981;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

/* ================= SETTINGS ================= */

.settings{
  display:flex;
  gap:10px;
  padding:10px 14px;
  overflow-x:auto;
}

.settings select,
.settings label{
  background:#0f172a;
  border:1px solid #334155;
  color:white;
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  cursor:pointer;
  white-space:nowrap;
}

.settings input{ accent-color:#10b981 }

/* ================= QUICK ================= */

.quick{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:10px 15px;
}

.quick button{
  background:#0f172a;
  border:1px solid #334155;
  color:white;
  padding:7px 14px;
  border-radius:999px;
  font-size:12px;
  cursor:pointer;
}

/* ================= CHAT ================= */

.chat{
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
  padding-bottom:220px;
}

.msg{
  max-width:85%;
  padding:12px 15px;
  border-radius:18px;
  font-size:14px;
  line-height:1.6;
}

.user{
  align-self:flex-end;
  background:#1e293b;
}

.ai{
  align-self:flex-start;
  background:#064e3b;
}

/* ================= INPUT ================= */

.input-box{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#020617;
  padding:12px;
  display:flex;
  gap:10px;
  border-top:1px solid #1e293b;
  z-index:600;
}

textarea{
  flex:1;
  resize:none;
  border-radius:14px;
  border:1px solid #334155;
  background:#020617;
  color:white;
  padding:10px;
  font-size:13px;
}

button{
  background:#10b981;
  border:none;
  padding:0 18px;
  border-radius:14px;
  color:black;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="overlay" onclick="toggleSidebar()"></div>

<div id="sidebar">
<button class="new-chat" onclick="newChat()">+ Chat Baru</button>
<h3>Riwayat Chat</h3>
<div id="chatTabs"></div>
</div>

<header>
<button class="toggle-btn" onclick="toggleSidebar()">☰</button>
🕌 Tanya Ustadz AI
<span style="font-size:11px;background:#facc15;color:black;padding:4px 10px;border-radius:999px;margin-left:6px;">PRO</span>
</header>

<div class="settings">
<select id="mode">
<option value="ai">Mode Konsultan</option>
<option value="fiqh">Mode Fiqh</option>
</select>

<select id="mazhab">
<option value="netral">Mazhab: Netral</option>
<option value="syafii">Syafi’i</option>
<option value="hanafi">Hanafi</option>
<option value="maliki">Maliki</option>
<option value="hanbali">Hanbali</option>
</select>

<select id="persona">
<option value="ilmiah">Ustadz Ilmiah</option>
<option value="santai">Santai</option>
<option value="remaja">Remaja Friendly</option>
<option value="tradisional">Tradisional</option>
</select>

<label><input type="checkbox" id="dalil" checked> Dalil</label>
<label><input type="checkbox" id="ringkas"> Ringkas</label>
<label><input type="checkbox" id="detail"> Detail</label>
</div>

<div class="quick">
<button onclick="askQuick('Apakah riba itu haram?')">Riba</button>
<button onclick="askQuick('Apa syarat sah shalat?')">Shalat</button>
<button onclick="askQuick('Apakah yang membatalkan wudhu?')">Wudhu</button>
<button onclick="askQuick('Bagaimana hukum zakat?')">Zakat</button>
</div>

<div class="chat" id="chat"></div>

<div class="input-box">
<textarea id="input" rows="2"
placeholder="Tanyakan masalah ibadah, muamalah, keluarga, dsb..."></textarea>
<button onclick="send()">Kirim</button>
</div>

 <script>

/* ================= DATA ================= */

let uid = localStorage.getItem("nr_uid") || "uid-" + Date.now();
localStorage.setItem("nr_uid", uid);

let allChats = JSON.parse(localStorage.getItem("nr_all_chats")||"[]");
let currentChatId = null;

/* ================= SAVE ================= */

function saveTabs(){
 localStorage.setItem("nr_all_chats",JSON.stringify(allChats));
}

/* ================= TAB ================= */

function renderTabs(){
 const wrap=document.getElementById("chatTabs");
 wrap.innerHTML="";

 allChats.forEach(c=>{
   const d=document.createElement("div");
   d.className="chat-tab"+(c.id===currentChatId?" active":"");
   d.innerHTML=`${c.title}
   <span style="float:right;cursor:pointer"
   onclick="deleteChat('${c.id}',event)">✕</span>`;

   d.onclick=()=>loadChat(c.id);
   d.oncontextmenu=(e)=>{e.preventDefault();renameChat(c.id)};

   wrap.appendChild(d);
 });
}

function newChat(){
 const id="chat-"+Date.now();
 const data={id,title:"Chat Baru",messages:[]};
 allChats.unshift(data);
 currentChatId=id;
 saveTabs();
 renderTabs();
 loadChat(id);
}

function loadChat(id){
 currentChatId=id;
 const chat=document.getElementById("chat");
 chat.innerHTML="";

 const data=allChats.find(c=>c.id===id);
 if(data){
   data.messages.forEach(m=>{
     addMessage(m.role,m.text,false);
   });
 }

 renderTabs();
 toggleSidebar(false);
}

function deleteChat(id,e){
 e.stopPropagation();
 allChats=allChats.filter(c=>c.id!==id);
 if(allChats.length===0)newChat();
 else loadChat(allChats[0].id);
 saveTabs();
 renderTabs();
}

function renameChat(id){
 const data=allChats.find(c=>c.id===id);
 const name=prompt("Rename chat:",data.title);
 if(!name)return;
 data.title=name;
 saveTabs();
 renderTabs();
}

/* ================= SIDEBAR ================= */

function toggleSidebar(forceClose){
 const sb=document.getElementById("sidebar");
 const ov=document.getElementById("overlay");

 if(forceClose===false){
   sb.classList.remove("show");
   ov.classList.remove("show");
   document.body.classList.remove("sidebar-open");
   return;
 }

 sb.classList.toggle("show");
 ov.classList.toggle("show");
 document.body.classList.toggle("sidebar-open");
}

/* ================= MESSAGE ================= */

function addMessage(role,text,save=true){

 const chat=document.getElementById("chat");

 const d=document.createElement("div");
 d.className="msg "+(role==="user"?"user":"ai");
 d.innerHTML=text.replace(/\n/g,"<br>");

 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;

 if(save){
   const data=allChats.find(c=>c.id===currentChatId);
   if(data){
     data.messages.push({role,text});
     if(data.title==="Chat Baru" && role==="user"){
       data.title=text.substring(0,30)+"...";
     }
     saveTabs();
   }
 }
}

/* ================= TYPING EFFECT ================= */

function typingEffect(text,callback){

 const chat=document.getElementById("chat");

 const bubble=document.createElement("div");
 bubble.className="msg ai";
 chat.appendChild(bubble);

 let i=0;

 const interval=setInterval(()=>{
   bubble.innerHTML=text.substring(0,i).replace(/\n/g,"<br>");
   chat.scrollTop=chat.scrollHeight;
   i++;

   if(i>text.length){
     clearInterval(interval);
     if(callback)callback(text);
   }
 },15);
}

/* ================= LOADING ================= */

function showLoading(){
 const chat=document.getElementById("chat");
 const loading=document.createElement("div");
 loading.className="msg ai";
 loading.id="loadingBubble";
 loading.innerHTML="Ustadz sedang mengetik<span id='dots'>...</span>";
 chat.appendChild(loading);
 chat.scrollTop=chat.scrollHeight;

 let dotCount=0;
 const dotInterval=setInterval(()=>{
   const dots=document.getElementById("dots");
   if(!dots){clearInterval(dotInterval);return;}
   dotCount=(dotCount+1)%4;
   dots.innerHTML=".".repeat(dotCount);
 },500);
}

function removeLoading(){
 const l=document.getElementById("loadingBubble");
 if(l)l.remove();
}

/* ================= SEND ================= */

async function send(){

 const input=document.getElementById("input");
 const q=input.value.trim();
 if(!q)return;

 addMessage("user",q);
 input.value="";

 showLoading();

 try{

   const systemPrompt = `
Anda adalah Ustadz AI yang menjawab sesuai Al-Qur'an dan Sunnah.
Jawab dengan bahasa yang jelas dan terstruktur.
Di akhir jawaban, tambahkan bagian:

📖 Rekomendasi Ayat:
- Sebutkan 1-3 ayat yang relevan
- Sertakan nama surat dan nomor ayat
- Jika memungkinkan sertakan kutipan singkat ayatnya
`;

   const res=await fetch(
     "https://noorrahma-ai.pembang001.workers.dev/assistant/ai",
     {
       method:"POST",
       headers:{"content-type":"application/json"},
       body:JSON.stringify({
         uid:uid,
         prompt: systemPrompt + "\n\nPertanyaan:\n" + q
       })
     }
   );

   const d=await res.json();
   const ans=d.answer||"⚠️ Tidak bisa menjawab.";

   removeLoading();

   typingEffect(ans,(finalText)=>{

     const data=allChats.find(c=>c.id===currentChatId);
     if(data){
       data.messages.push({role:"ai",text:finalText});
       saveTabs();
     }

   });

 }catch(e){
   removeLoading();
   addMessage("ai","⚠️ Terjadi kesalahan koneksi.");
 }
}

/* ================= QUICK ================= */

function askQuick(text){
 document.getElementById("input").value=text;
 send();
}

/* ================= INIT ================= */

if(allChats.length===0)newChat();
else{
 currentChatId=allChats[0].id;
 loadChat(currentChatId);
}

renderTabs();

</script>
  
</body>
</html>
