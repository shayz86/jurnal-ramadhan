<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanya Ustadz AI - NoorRahma</title>
<link rel="manifest" href="/manifest.json" />

<style>
body{
  margin:0;
  background:#020617;
  color:white;
  font-family:system-ui;
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* ===== SIDEBAR ===== */

.sidebar{
  width:270px;
  background:#0f172a;
  height:100vh;
  overflow-y:auto;
  padding:15px;
  border-right:1px solid #1e293b;
  transition:.3s;
}

.sidebar h3{
  font-size:13px;
  opacity:.6;
  margin-bottom:10px;
}

.new-chat{
  background:#10b981;
  border:none;
  padding:10px;
  border-radius:8px;
  width:100%;
  margin-bottom:15px;
  font-weight:bold;
  cursor:pointer;
}

.chat-tab{
  background:#1e293b;
  padding:10px;
  border-radius:8px;
  margin-bottom:8px;
  font-size:13px;
  cursor:pointer;
  transition:.2s;
  position:relative;
}

.chat-tab:hover{
  background:#334155;
}

.chat-tab.active{
  background:#064e3b;
}

.chat-tab small{
  opacity:.5;
  font-size:10px;
  display:block;
}

.delete-btn{
  position:absolute;
  right:8px;
  top:6px;
  font-size:12px;
  cursor:pointer;
  opacity:.5;
}

.delete-btn:hover{opacity:1;color:#f87171}

.toggle-btn{
  position:fixed;
  left:15px;
  top:15px;
  background:#10b981;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  z-index:100;
  cursor:pointer;
}

/* ===== MAIN ===== */

.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* ===== HEADER ===== */

header{
  padding:18px;
  text-align:center;
  font-weight:bold;
  font-size:18px;
  background:linear-gradient(to right,#059669,#0ea5e9);
}

/* ===== CHAT ===== */

.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.msg{
  max-width:85%;
  padding:14px 16px;
  border-radius:18px;
  font-size:14px;
  line-height:1.6;
  animation:fadeIn .2s ease-in-out;
}

.user{
  align-self:flex-end;
  background:#1e293b;
}

.ai{
  align-self:flex-start;
  background:#064e3b;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1}
}

/* ===== INPUT ===== */

.input-box{
  padding:12px;
  display:flex;
  gap:10px;
  border-top:1px solid #1e293b;
  background:#020617;
}

textarea{
  flex:1;
  resize:none;
  border-radius:14px;
  border:1px solid #334155;
  background:#020617;
  color:white;
  padding:10px;
  font-size:14px;
}

button{
  background:#10b981;
  border:none;
  padding:0 18px;
  border-radius:14px;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

/* ===== MOBILE ===== */

@media(max-width:768px){
  .sidebar{
    position:fixed;
    left:-270px;
    z-index:200;
  }
  .sidebar.show{
    left:0;
  }
}
</style>
</head>

<body>

<button class="toggle-btn" onclick="toggleSidebar()">☰</button>

<div class="sidebar" id="sidebar">
  <button class="new-chat" onclick="newChat()">+ Chat Baru</button>
  <h3>Riwayat Chat</h3>
  <div id="chatTabs"></div>
</div>

<div class="main">

<header>
 🕌 Tanya Ustadz AI
 <span style="font-size:11px;background:#facc15;color:black;padding:4px 10px;border-radius:999px;margin-left:6px;">PRO</span>
</header>

<div class="chat" id="chat"></div>

<div class="input-box">
<textarea id="input" rows="2" placeholder="Tanyakan sesuatu..."></textarea>
<button onclick="send()">Kirim</button>
</div>

</div>

<script>

let allChats=JSON.parse(localStorage.getItem("nr_all_chats")||"[]");
let currentChatId=null;

function save(){localStorage.setItem("nr_all_chats",JSON.stringify(allChats));}

function renderTabs(){
 const wrap=document.getElementById("chatTabs");
 wrap.innerHTML="";
 allChats.forEach(c=>{
   const d=document.createElement("div");
   d.className="chat-tab"+(c.id===currentChatId?" active":"");
   d.innerHTML=`${c.title}
   <small>${new Date(c.id.split("-")[1]*1).toLocaleString()}</small>
   <span class="delete-btn" onclick="deleteChat('${c.id}',event)">✕</span>`;
   d.onclick=()=>loadChat(c.id);
   d.oncontextmenu=(e)=>{e.preventDefault();renameChat(c.id)};
   wrap.appendChild(d);
 });
}

function newChat(){
 const id="chat-"+Date.now();
 allChats.unshift({id,title:"Chat Baru",messages:[]});
 currentChatId=id;
 save();
 renderTabs();
 loadChat(id);
}

function loadChat(id){
 currentChatId=id;
 const chat=document.getElementById("chat");
 chat.innerHTML="";
 const data=allChats.find(c=>c.id===id);
 data.messages.forEach(m=>add(m.role,m.text,false));
 renderTabs();
}

function add(role,text,saveMsg=true){
 const chat=document.getElementById("chat");
 const d=document.createElement("div");
 d.className="msg "+(role==="user"?"user":"ai");
 d.innerHTML=text.replace(/\n/g,"<br>");
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;

 if(saveMsg){
  const data=allChats.find(c=>c.id===currentChatId);
  data.messages.push({role,text});
  if(data.title==="Chat Baru"){
    data.title=text.substring(0,30)+"...";
  }
  save();
 }
}

async function send(){
 const input=document.getElementById("input");
 const q=input.value.trim();
 if(!q)return;
 add("user",q);
 input.value="";
 const res=await fetch("https://noorrahma-app.pembang001.workers.dev/assistant/ai",{
  method:"POST",
  headers:{"content-type":"application/json"},
  body:JSON.stringify({prompt:q})
 });
 const d=await res.json();
 add("ai",d.answer||"Tidak ada jawaban.");
}

function deleteChat(id,e){
 e.stopPropagation();
 allChats=allChats.filter(c=>c.id!==id);
 if(allChats.length===0)newChat();
 else loadChat(allChats[0].id);
 save();
 renderTabs();
}

function renameChat(id){
 const name=prompt("Rename chat:");
 if(!name)return;
 const data=allChats.find(c=>c.id===id);
 data.title=name;
 save();
 renderTabs();
}

function toggleSidebar(){
 document.getElementById("sidebar").classList.toggle("show");
}

/* AUTO NEW CHAT */
if(allChats.length===0)newChat();
else newChat();

renderTabs();

</script>

</body>
</html>
