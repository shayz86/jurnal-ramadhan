let activeCat="semua";

function render(){

const list = activeCat==="semua"
? doaData
: doaData.filter(d=>d.cat===activeCat);

document.getElementById("app").innerHTML=`

<h1 class="text-xl font-bold text-center mb-2">🤲 Doa Premium</h1>

<div class="flex gap-2 overflow-x-auto pb-3">

${categories.map(c=>`

<button onclick="setCat('${c}')"
class="px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap
${activeCat===c
? "bg-emerald-600 text-white"
: "bg-slate-200 dark:bg-slate-800"}">

${c.toUpperCase()}

</button>

`).join("")}

</div>

<div class="space-y-4">

${list.map(d=>`

<div class="bg-white dark:bg-slate-900 p-4 rounded-2xl shadow border">

<h3 class="font-bold mb-2">${d.title}</h3>

<p class="font-arab text-right text-2xl mb-3" dir="rtl">${d.arab}</p>

<p class="italic text-emerald-700 text-sm mb-1">${d.latin}</p>

<p class="text-slate-600 text-sm">${d.arti}</p>

</div>

`).join("")}

</div>

`;

}

function setCat(c){ activeCat=c; render(); }

render();
