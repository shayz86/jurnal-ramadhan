<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Doa Premium — NoorRahma</title>

<style>
body {
  margin:0;
  font-family: system-ui, sans-serif;
  background:#050b18;
  color:white;
}

header {
  padding:18px;
  font-size:20px;
  font-weight:700;
  background:linear-gradient(135deg,#059669,#10b981);
}

.container {
  padding:14px;
}

select {
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  margin-bottom:14px;
}

.card {
  background:#0f172a;
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
  border:1px solid rgba(255,255,255,.06);
}

.cat {
  font-size:10px;
  letter-spacing:.08em;
  opacity:.7;
  margin-bottom:6px;
}

.arab {
  font-size:26px;
  line-height:1.8;
  text-align:right;
}

.latin {
  margin-top:10px;
  color:#34d399;
  font-style:italic;
}

.arti {
  opacity:.9;
  margin-top:6px;
  font-size:14px;
}

footer {
  text-align:center;
  opacity:.5;
  font-size:11px;
  margin:20px 0;
}
</style>
</head>

<body>

<header>🤲 Doa Premium</header>

<div class="container">

<select id="filter">
<option value="semua">Semua</option>
<option value="harian">Harian</option>
<option value="ramadhan">Ramadhan</option>
<option value="stres">Stres</option>
<option value="hutang">Hutang</option>
<option value="sakit">Sakit</option>
<option value="rezeki">Rezeki</option>
<option value="keluarga">Keluarga</option>
<option value="anak">Anak</option>
<option value="kerja">Kerja</option>
</select>

<div id="list"></div>

<footer>© NoorRahma PRO</footer>

</div>

<script>
const doa = [

{cat:"harian",arab:"اللَّهُمَّ بِاسْمِكَ أَمُوتُ وَأَحْيَا",latin:"Allahumma bismika amuutu wa ahyaa.",arti:"Ya Allah, dengan nama-Mu aku mati dan hidup."},

{cat:"harian",arab:"رَبِّ زِدْنِي عِلْمًا",latin:"Rabbi zidnii 'ilmaa.",arti:"Ya Rabb, tambahkanlah kepadaku ilmu."},

{cat:"rezeki",arab:"اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ",latin:"Allahummakfinii bihalaalika 'an haraamika.",arti:"Ya Allah, cukupkan aku dengan yang halal dari yang haram."},

{cat:"hutang",arab:"اللَّهُمَّ اقْضِ عَنِّي الدَّيْنَ",latin:"Allahummaqdhi 'annid dain.",arti:"Ya Allah, lunasilah hutangku."},

{cat:"sakit",arab:"اللَّهُمَّ اشْفِنِي شِفَاءً لَا يُغَادِرُ سَقَمًا",latin:"Allahummashfinii shifaa'an laa yughaadiru saqamaa.",arti:"Ya Allah, sembuhkan aku dengan kesembuhan sempurna."},

{cat:"stres",arab:"اللَّهُمَّ اشْرَحْ لِي صَدْرِي",latin:"Allahummashrah lii shadrii.",arti:"Ya Allah, lapangkanlah dadaku."},

{cat:"keluarga",arab:"رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ",latin:"Rabbanaa hab lanaa min azwaajinaa wa dzurriyyaatinaa qurrata a'yun.",arti:"Ya Rabb, anugerahkan keluarga penyejuk hati."},

{cat:"anak",arab:"رَبِّ هَبْ لِي مِنَ الصَّالِحِينَ",latin:"Rabbi hab lii minas shaalihiin.",arti:"Ya Rabb, karuniakan anak yang saleh."},

{cat:"kerja",arab:"اللَّهُمَّ بَارِكْ لِي فِي عَمَلِي",latin:"Allahumma baarik lii fii 'amalii.",arti:"Ya Allah, berkahilah pekerjaanku."},

{cat:"ramadhan",arab:"اللَّهُمَّ بَلِّغْنَا رَمَضَانَ",latin:"Allahumma ballighnaa Ramadhaan.",arti:"Ya Allah, sampaikan kami ke Ramadhan."},

{cat:"ramadhan",arab:"اللَّهُمَّ تَقَبَّلْ صِيَامَنَا",latin:"Allahumma taqabbal shiyaamanaa.",arti:"Ya Allah, terimalah puasa kami."},

{cat:"stres",arab:"حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ",latin:"Hasbiyallaahu laa ilaaha illaa Huwa.",arti:"Cukuplah Allah bagiku."},

{cat:"rezeki",arab:"رَبِّ إِنِّي لِمَا أَنْزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ",latin:"Rabbi innii limaa anzalta ilayya min khairin faqiir.",arti:"Ya Rabb, aku butuh kebaikan dari-Mu."},

{cat:"sakit",arab:"أَذْهِبِ الْبَأْسَ رَبَّ النَّاسِ",latin:"Adhhib il-ba'sa Rabbann-naas.",arti:"Hilangkan penyakit wahai Rabb manusia."},

{cat:"keluarga",arab:"رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ",latin:"Rabbighfir lii waliwaalidayya.",arti:"Ya Rabb, ampunilah aku dan orang tuaku."},

{cat:"anak",arab:"اللَّهُمَّ اجْعَلْهُمْ مِنَ الصَّالِحِينَ",latin:"Allahummaj'alhum minas shaalihiin.",arti:"Ya Allah, jadikan mereka anak saleh."},

{cat:"kerja",arab:"اللَّهُمَّ يَسِّرْ وَلَا تُعَسِّرْ",latin:"Allahumma yassir walaa tu'assir.",arti:"Ya Allah mudahkanlah, jangan persulit."},

{cat:"harian",arab:"أَسْتَغْفِرُ اللَّهَ",latin:"Astaghfirullaah.",arti:"Aku memohon ampun kepada Allah."},

{cat:"harian",arab:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",latin:"Subhaanallaahi wa bihamdih.",arti:"Maha Suci Allah dan segala puji bagi-Nya."},

{cat:"hutang",arab:"اللَّهُمَّ اكْفِنِي فَقْرِي",latin:"Allahummakfinii faqrii.",arti:"Ya Allah, cukupkan aku dari kefakiran."},

{cat:"rezeki",arab:"اللَّهُمَّ ارْزُقْنِي رِزْقًا طَيِّبًا",latin:"Allahummarzuqnii rizqan thayyibaa.",arti:"Ya Allah, berilah rezeki yang baik."},

{cat:"stres",arab:"رَبِّ لَا تَذَرْنِي فَرْدًا",latin:"Rabbi laa tazarnii fardaa.",arti:"Ya Rabb jangan biarkan aku sendiri."},

{cat:"sakit",arab:"اللَّهُمَّ عَافِنِي",latin:"Allahumma 'aafinii.",arti:"Ya Allah, sehatkanlah aku."},

{cat:"keluarga",arab:"اللَّهُمَّ أَصْلِحْ لِي أَهْلِي",latin:"Allahumma ashlih lii ahlii.",arti:"Ya Allah, perbaikilah keluargaku."},

{cat:"anak",arab:"رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِنْ ذُرِّيَّتِي",latin:"Rabbij'alnii muqiimash-shalaah wa min dzurriyyatii.",arti:"Ya Rabb, jadikan aku dan anakku ahli shalat."},

{cat:"kerja",arab:"اللَّهُمَّ وَفِّقْنِي",latin:"Allahumma waffiqnii.",arti:"Ya Allah, berilah aku taufik."}

];

const list=document.getElementById("list");
const filter=document.getElementById("filter");

function render(){
  list.innerHTML="";
  doa.filter(d=>filter.value==="semua"||d.cat===filter.value)
  .forEach(d=>{
    list.innerHTML+=`
    <div class="card">
      <div class="cat">${d.cat.toUpperCase()}</div>
      <div class="arab">${d.arab}</div>
      <div class="latin">"${d.latin}"</div>
      <div class="arti">${d.arti}</div>
    </div>`;
  });
}

filter.onchange=render;
render();
</script>

</body>
</html>
