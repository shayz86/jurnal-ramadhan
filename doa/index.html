<style>
body {

<body class="text-white min-h-screen">

<header class="p-4 sticky top-0 bg-black/60 backdrop-blur z-50">

  <p class="text-xs opacity-70">Khusus akun PRO</p>

<!-- CATEGORY GRID -->
<div class="flex gap-3 overflow-x-auto px-4 py-4 snap-x">

  <button onclick="setCategory('semua')" class="cat">Semua</button>
  <button onclick="setCategory('harian')" class="cat">Harian</button>
  <button onclick="setCategory('ramadhan')" class="cat">Ramadhan</button>
  <button onclick="setCategory('stres')" class="cat">Stres</button>
  <button onclick="setCategory('hutang')" class="cat">Hutang</button>
  <button onclick="setCategory('sakit')" class="cat">Sakit</button>
  <button onclick="setCategory('rezeki')" class="cat">Rezeki</button>
  <button onclick="setCategory('keluarga')" class="cat">Keluarga</button>
  <button onclick="setCategory('anak')" class="cat">Anak</button>
  <button onclick="setCategory('kerja')" class="cat">Kerja</button>

</div>

<style>
.cat{
  background:#064e3b;
  padding:.5rem .9rem;
  border-radius:999px;
  font-size:.7rem;
  white-space:nowrap;
}
.cat.active{background:#10b981;}
</style>

/* ================= RENDER ================= */

let currentCat="semua";

function setCategory(cat){
  currentCat=cat;
  document.querySelectorAll(".cat").forEach(b=>{
    b.classList.toggle("active",b.innerText.toLowerCase()==cat);
  });
  render();
}

function render(){
  const el=document.getElementById("doaList");
  el.innerHTML="";
  doaData
   .filter(d=>currentCat=="semua"||d.cat==currentCat)
   .forEach(d=>{
    el.innerHTML+=`
<div class="bg-slate-900/80 rounded-2xl p-4 border border-emerald-800">
<h3 class="font-bold text-emerald-400 text-sm mb-2">${d.title}</h3>
<p class="text-right text-2xl leading-loose mb-3" dir="rtl">${d.arab}</p>
<p class="italic text-emerald-300 text-sm mb-2">${d.latin}</p>
<p class="text-xs opacity-80">${d.arti}</p>
</div>`;
   });
}

setCategory("semua");
</script>
