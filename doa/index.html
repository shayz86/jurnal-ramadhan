arab:"اَللّٰهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ",
latin:"Allahumma a‘innii ‘alaa dzikrika wa syukrika wa husni ‘ibaadatika.",
arti:"Ya Allah bantulah aku untuk selalu mengingat-Mu, bersyukur kepada-Mu, dan beribadah dengan baik."},

{cat:"kerja",title:"Doa Naik Jabatan",
arab:"رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي",

arti:"Ya Tuhanku lapangkanlah dadaku dan mudahkanlah urusanku."},

];

/* ===== UI ===== */

const catsDiv=document.getElementById("cats");
const list=document.getElementById("list");
const search=document.getElementById("search");

let active="semua";
let favs=JSON.parse(localStorage.getItem("doaFav")||"[]");

categories.forEach(c=>{
 const b=document.createElement("button");
 b.textContent=c.toUpperCase();
 b.onclick=()=>select(c);
 if(c==="semua")b.classList.add("active");
 catsDiv.appendChild(b);
});

function select(cat){
 active=cat;
 [...catsDiv.children].forEach(x=>{
  x.classList.toggle("active",x.textContent.toLowerCase()===cat);
 });
 render();
}

search.oninput=render;

/* ===== FAVORIT ===== */

function toggleFav(i){
 if(favs.includes(i))
   favs=favs.filter(x=>x!==i);
 else favs.push(i);

 localStorage.setItem("doaFav",JSON.stringify(favs));
 render();
}

/* ===== AUDIO ENGINE ===== */

let speaking=null;

function playAudio(i){

 const doa=data[i];

 if(speaking){
  window.speechSynthesis.cancel();
  speaking=null;
 }

 const u=new SpeechSynthesisUtterance(doa.arab);
 u.lang="ar-SA";

 speaking=i;

 u.onend=()=>speaking=null;

 window.speechSynthesis.speak(u);
}

/* ===== RENDER ===== */

function render(){

 list.innerHTML="";
 const q=search.value.toLowerCase();

 data
 .filter(d=>
  (active==="semua"||d.cat===active)&&
  (
   d.title.toLowerCase().includes(q)||
   d.latin.toLowerCase().includes(q)||
   d.arti.toLowerCase().includes(q)
  )
 )
 .forEach(d=>{

  const i=data.indexOf(d);

  const div=document.createElement("div");
  div.className="card";

  const favActive=favs.includes(i);

  div.innerHTML=`

   <div class="audio-btn" onclick="playAudio(${i})">🔊</div>

   <div class="fav ${favActive?"active":""}"
     onclick="toggleFav(${i})">❤</div>

   <h4>${d.title}</h4>
   <div class="arab">${d.arab}</div>
   <div class="latin">${d.latin}</div>
   <div class="arti">${d.arti}</div>

  `;

  list.appendChild(div);

 });

}

render();

</script>
