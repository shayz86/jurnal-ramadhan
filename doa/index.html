<!DOCTYPE html>
<html lang="id">
<head>

<title>Doa Lengkap — NoorRahma</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter&family=Amiri&display=swap" rel="stylesheet">

<style>
body { font-family: Inter }

</style>

</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100">

<div id="app" class="max-w-md mx-auto p-4 space-y-4"></div>

<script>

const categories = [
  "semua","harian","ramadhan","stres","hutang","sakit",
  "rezeki","keluarga","anak","kerja"

const doaData = [

latin:"Alhamdulillāhilladzī aḥyā-nā ba‘da mā amātanā wa ilaihin-nusyūr.",

latin:"Allāhumma innī as’aluka khairal mauliji wa khairal makhraji.",
arti:"Ya Allah, aku memohon kepada-Mu sebaik-baik tempat masuk dan keluar."
},
{
cat:"harian",
title:"Doa Keluar Rumah",

latin:"Bismillāhi tawakkaltu ‘alallāh, lā ḥaula wa lā quwwata illā billāh.",
arti:"Dengan nama Allah aku bertawakal kepada-Nya, tidak ada daya dan kekuatan kecuali dengan-Nya."
},
{
cat:"harian",
title:"Doa Sebelum Tidur",
arab:"بِاسْمِكَ اللّٰهُمَّ أَحْيَا وَأَمُوتُ",
latin:"Bismikallāhumma aḥyā wa amūt.",
arti:"Dengan nama-Mu ya Allah aku hidup dan mati."
},
{
cat:"harian",
title:"Doa Mohon Perlindungan",
arab:"أَعُوذُ بِكَلِمَاتِ اللّٰهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",
latin:"A‘ūdzu bikalimātillāhit-tāmmāti min syarri mā khalaq.",
arti:"Aku berlindung dengan kalimat Allah yang sempurna dari kejahatan makhluk-Nya."
},

/* ================= RAMADHAN ================= */
{
cat:"ramadhan",
title:"Niat Puasa",
arab:"نَوَيْتُ صَوْمَ غَدٍ عَنْ أَدَاءِ فَرْضِ شَهْرِ رَمَضَانَ لِلّٰهِ تَعَالَى",
latin:"Nawaitu shauma ghadin ‘an adā’i farḍi syahri Ramaḍāna lillāhi ta‘ālā.",
arti:"Aku niat puasa esok hari untuk menunaikan kewajiban Ramadhan karena Allah."
},
{
cat:"ramadhan",
title:"Doa Berbuka",
arab:"اَللّٰهُمَّ لَكَ صُمْتُ وَبِكَ آمَنْتُ وَعَلَى رِزْقِكَ أَفْطَرْتُ",
latin:"Allāhumma laka shumtu wa bika āmantu wa ‘alā rizqika afṭartu.",
arti:"Ya Allah, kepada-Mu aku berpuasa, kepada-Mu aku beriman, dan dengan rezeki-Mu aku berbuka."
},
{
cat:"ramadhan",
title:"Lailatul Qadar",
arab:"اللّٰهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي",
latin:"Allāhumma innaka ‘afuwwun tuḥibbul ‘afwa fa‘fu ‘annī.",
arti:"Ya Allah, Engkau Maha Pemaaf dan menyukai maaf, maka maafkanlah aku."
},
{
cat:"ramadhan",
title:"Doa Qunut Witir",
arab:"اللّٰهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ وَعَافِنِي فِيمَنْ عَافَيْتَ...",
latin:"Allāhummahdinī fīman hadait wa ‘āfinī fīman ‘āfait...",

},
{

arti:"Ya Allah, rahmatilah aku dengan Al-Qur’an dan jadikan ia pemimpin dan cahaya."
},

/* ================= STRES ================= */
{
cat:"stres",
title:"Mohon Ketenangan",
arab:"اللّٰهُمَّ إِنِّي عَبْدُكَ ابْنُ عَبْدِكَ ابْنُ أَمَتِكَ نَاصِيَتِي بِيَدِكَ",
latin:"Allāhumma innī ‘abduka ibnu ‘abdika ibnu amatika...",
arti:"Ya Allah, aku adalah hamba-Mu, anak hamba-Mu..."
},
{
cat:"stres",
title:"Hilangkan Kesedihan",
arab:"اللّٰهُمَّ أَذْهِبْ عَنِّي الْهَمَّ وَالْحَزَنَ",
latin:"Allāhumma adzhhib ‘annil-hamma wal-ḥazan.",
arti:"Ya Allah, hilangkan dariku kesedihan dan kegundahan."
},
{
cat:"stres",
title:"Doa Lapang Dada",
arab:"رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي",
latin:"Rabbishraḥ lī ṣadrī wa yassir lī amrī.",
arti:"Wahai Tuhanku, lapangkan dadaku dan mudahkan urusanku."
},
{
cat:"stres",
title:"Mohon Perlindungan Jiwa",
arab:"اللّٰهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ",
latin:"Allāhumma innī a‘ūdzu bika minal-hamm.",
arti:"Ya Allah aku berlindung dari kesedihan."
},
{
cat:"stres",
title:"Pasrah Kepada Allah",
arab:"حَسْبِيَ اللّٰهُ لَا إِلٰهَ إِلَّا هُوَ",
latin:"Ḥasbiyallāhu lā ilāha illā huwa.",
arti:"Cukuplah Allah bagiku, tiada Tuhan selain Dia."
},

];

let activeCat="semua";

const app=document.getElementById("app");

function render(){

const cats = `
<div class="flex gap-2 overflow-x-auto pb-2">
${categories.map(c=>`
<button onclick="setCat('${c}')"
class="px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap
${activeCat===c?'bg-emerald-600 text-white':'bg-white border'}">
${c.toUpperCase()}
</button>
`).join("")}
</div>`;

const list = doaData.filter(d=>activeCat==="semua"||d.cat===activeCat);

const cards = list.map(d=>`
<div class="bg-white dark:bg-slate-900 rounded-xl p-4 shadow border space-y-3">
<h3 class="font-bold">${d.title}</h3>
<p class="font-arab text-right text-2xl">${d.arab}</p>
<p class="italic text-emerald-700">${d.latin}</p>
<p class="text-sm text-slate-600">${d.arti}</p>
</div>
`).join("");

app.innerHTML = cats + `<div class="space-y-4">${cards}</div>`;
}

function setCat(c){activeCat=c;render()}

render();

</script>

</body>
</html>
