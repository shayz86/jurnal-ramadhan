<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<title>Kisah Nabi — NoorRahma</title>

<meta name="theme-color" content="#047857"/>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config={darkMode:"class"}
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Amiri&display=swap" rel="stylesheet"/>

<style>
.font-arab{font-family:Amiri,serif}
</style>

</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100">

<header class="bg-emerald-700 text-white p-4 sticky top-0">
 <div class="max-w-md mx-auto flex justify-between items-center">
  <button onclick="history.back()">←</button>
  <span class="font-bold text-sm" id="title">Kisah Nabi</span>
  <span class="text-[10px] bg-yellow-400 text-black px-2 py-1 rounded-full">PRO</span>
 </div>
</header>

<main class="max-w-md mx-auto p-4 space-y-4">

<!-- MODE SWITCH -->
<div class="flex gap-2">
 <button id="modeA" class="flex-1 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">
  Mode Anak
 </button>
 <button id="modeC" class="flex-1 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold">
  Tadabbur
 </button>
</div>

<!-- ACTION -->
<div class="flex justify-between items-center">
 <button id="bookmarkBtn" class="text-xs">☆ Simpan</button>

 <div class="flex gap-2">
  <button onclick="prevNabi()">◀</button>
  <button onclick="nextNabi()">▶</button>
 </div>
</div>

<!-- AUDIO -->
<div>
 <button id="playBtn"
  class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold text-sm">
  ▶ Dengarkan
 </button>
</div>

<!-- CONTENT -->
<div id="content"
 class="bg-white dark:bg-slate-900 rounded-2xl p-5 shadow-sm leading-relaxed text-sm space-y-4">
</div>

</main>

<script>

/* =====================
   CONFIG
===================== */

const isPro=localStorage.getItem("nr_is_pro")==="1";
if(!isPro){
 alert("Fitur PRO");
 location.href="/";
}

/* =====================
   SLUG
===================== */

const url=new URLSearchParams(location.search);
const slug=url.get("slug");

/* =====================
   DATA LOAD
===================== */

let nabiData=null;

fetch("/noorrahma/nabi/data.json")
 .then(r=>r.json())
 .then(d=>{
   nabiData=d;
   load();
 });

/* =====================
   MODE
===================== */

let mode="anak";

const setMode=m=>{
 mode=m;
 document.getElementById("modeA").className=
  m==="anak"
  ?"flex-1 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold"
  :"flex-1 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold";

 document.getElementById("modeC").className=
  m==="dewasa"
  ?"flex-1 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold"
  :"flex-1 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold";

 render();
};

modeA.onclick=()=>setMode("anak");
modeC.onclick=()=>setMode("dewasa");

/* =====================
   BOOKMARK
===================== */

let bookmarks=JSON.parse(localStorage.getItem("nr_nabi_story_bookmarks")||"[]");

const bookmarkBtn=document.getElementById("bookmarkBtn");

const updateBookmark=()=>{
 const saved=bookmarks.includes(slug);
 bookmarkBtn.textContent=saved?"⭐ Disimpan":"☆ Simpan";
};

bookmarkBtn.onclick=()=>{
 if(bookmarks.includes(slug))
  bookmarks=bookmarks.filter(s=>s!==slug);
 else bookmarks.push(slug);

 localStorage.setItem("nr_nabi_story_bookmarks",JSON.stringify(bookmarks));
 updateBookmark();
};

/* =====================
   RENDER
===================== */

function load(){

 const data=nabiData.find(n=>n.slug===slug);
 if(!data)return;

 document.getElementById("title").textContent=data.name;

 updateBookmark();

 render();
}

function render(){

 const d=nabiData.find(n=>n.slug===slug);
 if(!d)return;

 document.getElementById("content").innerHTML=
  (mode==="anak"?d.story_anak:d.story_tadabbur)
  .split("\n\n")
  .map(p=>`<p>${p}</p>`)
  .join("");
}

/* =====================
   NEXT / PREV
===================== */

function nextNabi(){
 const i=nabiData.findIndex(n=>n.slug===slug);
 if(i<nabiData.length-1)
  location.href=`?slug=${nabiData[i+1].slug}`;
}

function prevNabi(){
 const i=nabiData.findIndex(n=>n.slug===slug);
 if(i>0)
  location.href=`?slug=${nabiData[i-1].slug}`;
}

/* =====================
   TTS
===================== */

let audio;

playBtn.onclick=()=>{
 const d=nabiData.find(n=>n.slug===slug);
 if(!d)return;

 if(audio){audio.pause();audio=null;return;}

 fetch("https://noorrahma-api.pembang001.workers.dev/tts",{
  method:"POST",
  headers:{"content-type":"application/json"},
  body:JSON.stringify({
    text: mode==="anak"?d.story_anak:d.story_tadabbur,
    voice:"id"
  })
 }).then(r=>r.blob())
   .then(b=>{
    audio=new Audio(URL.createObjectURL(b));
    audio.play();
   });
};

</script>

</body>
</html>
