<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<title>Kisah Nabi — NoorRahma</title>

<meta name="theme-color" content="#047857"/>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={darkMode:"class"}
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Amiri&display=swap" rel="stylesheet"/>

<style>
.font-arab{font-family:Amiri,serif}
</style>

</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100">

<header class="bg-emerald-700 text-white p-4 sticky top-0 z-20">
 <div class="max-w-md mx-auto flex justify-between items-center">
  <button onclick="history.back()">←</button>
  <span class="font-bold text-sm" id="title">Kisah Nabi</span>
  <span class="text-[10px] bg-yellow-400 text-black px-2 py-1 rounded-full">PRO</span>
 </div>
</header>

<main id="swipeArea" class="max-w-md mx-auto p-4 space-y-4">

<!-- MODE -->
<div class="flex gap-2">
 <button id="modeA"
  class="flex-1 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">
  Mode Anak
 </button>

 <button id="modeC"
  class="flex-1 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold">
  Tadabbur
 </button>
</div>

<!-- ACTION -->
<div class="flex justify-between items-center">
 <button id="bookmarkBtn" class="text-xs">☆ Simpan</button>

 <div class="flex gap-3 text-sm">
  <button onclick="prevNabi()">◀</button>
  <button onclick="nextNabi()">▶</button>
 </div>
</div>

<!-- AUDIO -->
<div>
 <button id="playBtn"
  class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold text-sm">
  ▶ Dengarkan Kisah
 </button>
</div>

<!-- CONTENT -->
<div id="content"
 class="bg-white dark:bg-slate-900 rounded-2xl p-5 shadow-sm leading-relaxed text-sm space-y-4">
</div>

</main>

<script>

/* =====================
   PRO GATE
===================== */

const isPro=localStorage.getItem("nr_is_pro")==="1";
if(!isPro){
 alert("Fitur ini hanya untuk akun PRO");
 location.href="/";
}

/* =====================
   LOAD SLUG
===================== */

const qs=new URLSearchParams(location.search);
const slug=qs.get("slug");

/* =====================
   GLOBAL
===================== */

let nabiData=[];
let currentIndex=0;
let mode="anak";
let audio=null;

/* =====================
   JSON LOADER
===================== */

fetch("/noorrahma/nabi/data.json")
 .then(r=>r.json())
 .then(d=>{
   nabiData=d;
   init();
 });

function init(){

 currentIndex=nabiData.findIndex(n=>n.slug===slug);
 if(currentIndex<0)currentIndex=0;

 render();
 updateBookmark();
}

/* =====================
   MODE TOGGLE
===================== */

const setMode=m=>{
 mode=m;

 modeA.className=
  m==="anak"
  ?"flex-1 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold"
  :"flex-1 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold";

 modeC.className=
  m==="dewasa"
  ?"flex-1 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold"
  :"flex-1 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold";

 render();
};

modeA.onclick=()=>setMode("anak");
modeC.onclick=()=>setMode("dewasa");

/* =====================
   BOOKMARK
===================== */

let bookmarks=
 JSON.parse(localStorage.getItem("nr_nabi_story_bookmarks")||"[]");

const updateBookmark=()=>{
 const s=nabiData[currentIndex].slug;
 bookmarkBtn.textContent=
  bookmarks.includes(s)
   ?"⭐ Disimpan"
   :"☆ Simpan";
};

bookmarkBtn.onclick=()=>{
 const s=nabiData[currentIndex].slug;

 if(bookmarks.includes(s))
  bookmarks=bookmarks.filter(x=>x!==s);
 else bookmarks.push(s);

 localStorage.setItem(
  "nr_nabi_story_bookmarks",
  JSON.stringify(bookmarks)
 );

 updateBookmark();
};

/* =====================
   RENDER
===================== */

function render(){

 const d=nabiData[currentIndex];

 title.textContent=d.name;

 const txt=
  mode==="anak"
   ?d.story_anak
   :d.story_tadabbur;

 content.innerHTML=
  txt.split("\n\n")
     .map(p=>`<p>${p}</p>`)
     .join("");
}

/* =====================
   NAV
===================== */

function nextNabi(){
 if(currentIndex<nabiData.length-1){
  location.href=`?slug=${nabiData[currentIndex+1].slug}`;
 }
}

function prevNabi(){
 if(currentIndex>0){
  location.href=`?slug=${nabiData[currentIndex-1].slug}`;
 }
}

/* =====================
   SWIPE
===================== */

let startX=null;

const swipeArea=document.getElementById("swipeArea");

swipeArea.addEventListener("touchstart",e=>{
 startX=e.touches[0].clientX;
});

swipeArea.addEventListener("touchend",e=>{
 if(startX===null)return;

 const diff=e.changedTouches[0].clientX-startX;

 if(diff>80) prevNabi();
 if(diff<-80) nextNabi();

 startX=null;
});

/* =====================
   AUDIO TTS
===================== */

playBtn.onclick=()=>{

 const d=nabiData[currentIndex];

 if(audio){
  audio.pause();
  audio=null;
  playBtn.textContent="▶ Dengarkan Kisah";
  return;
 }

 fetch("https://noorrahma-api.pembang001.workers.dev/tts",{
  method:"POST",
  headers:{"content-type":"application/json"},
  body:JSON.stringify({
   text:
    mode==="anak"
     ?d.story_anak
     :d.story_tadabbur,
   voice:"id"
  })
 })
 .then(r=>r.blob())
 .then(b=>{
  audio=new Audio(URL.createObjectURL(b));
  audio.play();
  playBtn.textContent="⏸ Stop Audio";

  audio.onended=()=>{
   audio=null;
   playBtn.textContent="▶ Dengarkan Kisah";
  };
 });
};

</script>

</body>
</html>
