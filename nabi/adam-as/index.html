<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>Kisah Nabi — NoorRahma</title>

<link rel="manifest" href="/manifest.json" />

<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#020617; color:white }
.audio-btn.playing{background:#10b981;color:black}
</style>
</head>

<body class="min-h-screen">

<header class="bg-emerald-700 text-white p-4 text-center font-bold">
📖 Kisah Nabi & Rasul
</header>

<main class="max-w-xl mx-auto p-4 space-y-5">

<!-- PRO GATE -->
<div id="proGate" class="hidden bg-red-900/40 p-4 rounded-xl text-center">
🔒 Fitur PRO — Upgrade untuk membuka kisah lengkap.
</div>

<!-- CONTENT -->
<div id="content" class="hidden">

<h1 id="nama" class="text-xl font-bold"></h1>
<p id="arab" class="font-arab text-3xl text-center mt-2"></p>

<div class="flex justify-center gap-3 mt-4">

<button id="modeAnak"
 class="px-4 py-2 bg-indigo-600 rounded-xl text-xs font-bold">
Mode Anak 👶
</button>

<button id="modeTadabbur"
 class="px-4 py-2 bg-emerald-600 rounded-xl text-xs font-bold">
Mode Tadabbur 📖
</button>

</div>

<div class="flex justify-center gap-3 mt-4">

<button id="playAudio"
 class="audio-btn px-4 py-2 bg-slate-700 rounded-xl text-xs font-bold">
🔊 Putar
</button>

<button id="bookmarkBtn"
 class="px-4 py-2 bg-yellow-500 text-black rounded-xl text-xs font-bold">
⭐ Simpan
</button>

</div>

<!-- STORY -->
<div id="story" class="bg-slate-900 p-4 rounded-xl leading-relaxed text-sm"></div>

</div>

</main>

<script>
/* ========= CONFIG ========= */

const parts = location.pathname.split("/").filter(Boolean);
const slug = parts[parts.length - 2];

const isPro = localStorage.getItem("nr_is_pro")==="1";

/* ========= PRO CHECK ========= */

if(!isPro){
 document.getElementById("proGate").classList.remove("hidden");
}else{
 document.getElementById("content").classList.remove("hidden");
}

/* ========= LOAD DATA ========= */

fetch("/nabi/data.json")
.then(r=>r.json())
.then(list=>{

 const nabi=list.find(n=>n.slug===slug);
 if(!nabi) return;

 document.title=nabi.nama+" — NoorRahma";

 nama.textContent=nabi.nama;
 arab.textContent=nabi.arab;

 loadStory(slug,"anak");

});

/* ========= STORY ========= */

function loadStory(slug,mode){

 fetch(`/nabi/${slug}/${mode}.json`)
 .then(r=>r.json())
 .then(d=>{

   let html="";

   /* MODE ANAK */
   if(d.cerita){

     html+=`<h2 class="font-bold mb-3">${d.judul}</h2>`;

     d.cerita.forEach(p=>{
       html+=`<p class="mb-3">${p}</p>`;
     });

     if(d.hikmah){
       html+=`<hr class="my-4">`;
       html+=`<b>Hikmah:</b><ul class="list-disc pl-5">`;
       d.hikmah.forEach(h=>{
         html+=`<li>${h}</li>`;
       });
       html+=`</ul>`;
     }

     if(d.penutup){
       html+=`<p class="mt-4 italic">${d.penutup}</p>`;
     }

   }

   /* MODE TADABBUR */
   if(d.narasi){

     html+=`<h2 class="font-bold mb-3">${d.judul}</h2>`;

     d.narasi.forEach(n=>{
       html+=`
         <h3 class="mt-4 font-semibold">${n.judul}</h3>
         <p>${n.isi}</p>
       `;
     });

     if(d.hikmah){
       html+=`<hr class="my-4">`;
       html+=`<b>Hikmah:</b><ul class="list-disc pl-5">`;
       d.hikmah.forEach(h=>{
         html+=`<li>${h}</li>`;
       });
       html+=`</ul>`;
     }

     if(d.doa){
       html+=`<p class="mt-4 text-center text-xl">${d.doa}</p>`;
     }

     if(d.penutup){
       html+=`<p class="mt-4 italic">${d.penutup}</p>`;
     }

   }

   story.innerHTML=html;
   currentText=story.innerText;

 });
}

let currentText="";

/* ========= MODE ========= */

modeAnak.onclick=()=>loadStory(slug,"anak");
modeTadabbur.onclick=()=>loadStory(slug,"tadabbur");

/* ========= BOOKMARK ========= */

bookmarkBtn.onclick=()=>{

 let bm=
  JSON.parse(localStorage.getItem("nr_nabi_bookmarks")||"[]");

 if(!bm.includes(slug)){
  bm.push(slug);
  bookmarkBtn.textContent="⭐ Tersimpan";
 }

 localStorage.setItem("nr_nabi_bookmarks",JSON.stringify(bm));
};

/* ========= TTS ========= */

let utter;

playAudio.onclick=()=>{

 if(!("speechSynthesis" in window)){
  alert("TTS tidak tersedia");
  return;
 }

 if(utter){
  speechSynthesis.cancel();
  utter=null;
  playAudio.classList.remove("playing");
  playAudio.textContent="🔊 Putar";
  return;
 }

 utter=new SpeechSynthesisUtterance(currentText);
 utter.lang="id-ID";

 utter.onend=()=>{
  utter=null;
  playAudio.classList.remove("playing");
  playAudio.textContent="🔊 Putar";
 };

 speechSynthesis.speak(utter);
 playAudio.classList.add("playing");
 playAudio.textContent="⏹ Stop";
};

</script>

</body>
</html>
