<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Kisah 25 Nabi & Rasul — NoorRahma</title>

<meta name="theme-color" content="#047857" />
<link rel="manifest" href="/manifest.json" />

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config={
  darkMode:"class",
  theme:{
    extend:{
      colors:{ slate:{950:"#020617"} }
    }
  }
}
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>

</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100">

<header class="bg-emerald-700 text-white p-4 sticky top-0 z-20">
  <div class="max-w-md mx-auto flex items-center justify-between">
    <button onclick="history.back()">←</button>
    <h1 class="font-bold text-sm">📜 Kisah 25 Nabi & Rasul</h1>
    <span class="text-[10px] bg-yellow-400 text-black px-2 py-1 rounded-full font-bold">
      PRO
    </span>
  </div>
</header>

<main class="max-w-md mx-auto p-4 space-y-4">

<!-- ===== PRO LOCK ===== -->

<div id="proLock" class="hidden bg-amber-100 border border-amber-300 p-4 rounded-xl text-center">
  <h3 class="font-bold">Fitur PRO</h3>
  <p class="text-xs mt-1">
    Kisah lengkap para nabi hanya tersedia untuk akun PRO.
  </p>
</div>

<!-- ===== SEARCH ===== -->

<input id="searchInput"
 type="text"
 placeholder="Cari nama nabi..."
 class="w-full px-4 py-2 rounded-xl border bg-white dark:bg-slate-900"/>

<!-- ===== FILTER ===== -->

<select id="filterGen"
 class="w-full px-4 py-2 rounded-xl border bg-white dark:bg-slate-900">

 <option value="">Semua Generasi</option>
 <option value="awal-manusia">Awal Manusia</option>
 <option value="pra-banjir">Pra Banjir</option>
 <option value="bani-israil">Bani Israil</option>
 <option value="arab">Arab</option>

</select>

<!-- ===== GRID ===== -->

<div id="grid"
 class="grid grid-cols-2 gap-3"></div>

</main>

<script>

/* =====================
   PRO CHECK
===================== */

const isPro = localStorage.getItem("nr_is_pro")==="1";

if(!isPro){
 document.getElementById("proLock").classList.remove("hidden");
}

/* =====================
   DATA INDEX
===================== */

const prophets=[
 {slug:"adam-as",name:"Nabi Adam AS",generation:"awal-manusia"},
 {slug:"idris-as",name:"Nabi Idris AS",generation:"pra-banjir"},
 {slug:"nuh-as",name:"Nabi Nuh AS",generation:"pra-banjir"},
 {slug:"hud-as",name:"Nabi Hud AS",generation:"pra-banjir"},
 {slug:"shalih-as",name:"Nabi Shalih AS",generation:"pra-banjir"},
 {slug:"ibrahim-as",name:"Nabi Ibrahim AS",generation:"bani-israil"},
 {slug:"luth-as",name:"Nabi Luth AS",generation:"bani-israil"},
 {slug:"ismail-as",name:"Nabi Ismail AS",generation:"arab"},
 {slug:"ishaq-as",name:"Nabi Ishaq AS",generation:"bani-israil"},
 {slug:"yaqub-as",name:"Nabi Ya'qub AS",generation:"bani-israil"},
 {slug:"yusuf-as",name:"Nabi Yusuf AS",generation:"bani-israil"},
 {slug:"ayyub-as",name:"Nabi Ayyub AS",generation:"bani-israil"},
 {slug:"syuaib-as",name:"Nabi Syuaib AS",generation:"bani-israil"},
 {slug:"musa-as",name:"Nabi Musa AS",generation:"bani-israil"},
 {slug:"harun-as",name:"Nabi Harun AS",generation:"bani-israil"},
 {slug:"dzulkifli-as",name:"Nabi Dzulkifli AS",generation:"bani-israil"},
 {slug:"daud-as",name:"Nabi Daud AS",generation:"bani-israil"},
 {slug:"sulaiman-as",name:"Nabi Sulaiman AS",generation:"bani-israil"},
 {slug:"ilyas-as",name:"Nabi Ilyas AS",generation:"bani-israil"},
 {slug:"alyasa-as",name:"Nabi Alyasa AS",generation:"bani-israil"},
 {slug:"yunus-as",name:"Nabi Yunus AS",generation:"bani-israil"},
 {slug:"zakaria-as",name:"Nabi Zakaria AS",generation:"bani-israil"},
 {slug:"yahya-as",name:"Nabi Yahya AS",generation:"bani-israil"},
 {slug:"isa-as",name:"Nabi Isa AS",generation:"bani-israil"},
 {slug:"muhammad-saw",name:"Nabi Muhammad ﷺ",generation:"arab"}
];

/* =====================
   BOOKMARK
===================== */

let bookmarks=JSON.parse(localStorage.getItem("nr_nabi_bookmarks")||"[]");

const toggleBookmark=(slug)=>{
 if(bookmarks.includes(slug))
  bookmarks=bookmarks.filter(s=>s!==slug);
 else bookmarks.push(slug);

 localStorage.setItem("nr_nabi_bookmarks",JSON.stringify(bookmarks));
 render();
}

/* =====================
   RENDER
===================== */

const grid=document.getElementById("grid");
const searchInput=document.getElementById("searchInput");
const filterGen=document.getElementById("filterGen");

function render(){

 grid.innerHTML="";

 let list=[...prophets];

 if(searchInput.value)
  list=list.filter(p=>
   p.name.toLowerCase().includes(searchInput.value.toLowerCase())
  );

 if(filterGen.value)
  list=list.filter(p=>p.generation===filterGen.value);

 list.forEach(p=>{

  const isSaved=bookmarks.includes(p.slug);

  const card=document.createElement("div");
  card.className="bg-white dark:bg-slate-900 p-3 rounded-xl border shadow-sm relative";

  card.innerHTML=`
   <button onclick="toggleBookmark('${p.slug}')"
    class="absolute top-2 right-2 text-lg">
     ${isSaved?"⭐":"☆"}
   </button>

   <div onclick="openNabi('${p.slug}')"
    class="cursor-pointer">
    <div class="text-3xl">📖</div>
    <h4 class="font-bold text-sm mt-2">${p.name}</h4>
    <p class="text-[10px] text-slate-500">${p.generation}</p>
   </div>
  `;

  grid.appendChild(card);
 });

}

const openNabi=(slug)=>{
 if(!isPro){
  alert("Fitur PRO. Upgrade untuk membuka kisah lengkap nabi.");
  return;
 }
 location.href=`/noorrahma/nabi/${slug}/`;
};

searchInput.oninput=render;
filterGen.onchange=render;

render();

</script>

</body>
</html>
