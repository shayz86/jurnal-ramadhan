<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kisah 25 Nabi — NoorRahma</title>

<script src="https://cdn.tailwindcss.com"></script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>

<body class="bg-slate-50 dark:bg-slate-950">

<div id="root"></div>

<script type="text/babel">

const { useState, useEffect } = React;

const App = () => {

  const [nabiList, setNabiList] = useState([]);
  const [selected, setSelected] = useState(null);
  const [mode, setMode] = useState("child");

  // ==== PRO CHECK ====
  const isPro = localStorage.getItem("nr_is_pro") === "1";

  useEffect(() => {
    if (!isPro) location.href="/";
  }, []);

  useEffect(() => {
    fetch("/nabi/data.json")
      .then(r=>r.json())
      .then(setNabiList);
  }, []);

  if (!isPro)
    return (
      <div className="min-h-screen flex items-center justify-center text-slate-400">
        PRO Only
      </div>
    );

  return (
    <div className="max-w-md mx-auto p-4 space-y-5">

      {/* HEADER */}
      <div className="flex items-center gap-3">
        {selected && (
          <button
            onClick={()=>setSelected(null)}
            className="text-sm font-bold text-emerald-600"
          >
            ← Kembali
          </button>
        )}

        <h1 className="font-bold text-lg">
          📜 Kisah 25 Nabi & Rasul
        </h1>
      </div>

      {!selected && (

        <>
          {/* MODE */}
          <div className="flex bg-slate-200 dark:bg-slate-800 rounded-xl p-1">
            {["child","adult"].map(m=>(
              <button
                key={m}
                onClick={()=>setMode(m)}
                className={`
                  flex-1 py-2 rounded-lg text-xs font-bold
                  ${mode===m
                    ? "bg-white dark:bg-slate-900 text-emerald-600"
                    : "text-slate-500"}
                `}
              >
                {m==="child" ? "Mode Anak 👶" : "Mode Dewasa 📖"}
              </button>
            ))}
          </div>

          {/* LIST */}
          <div className="grid grid-cols-2 gap-3">

            {nabiList.map(n=>(
              <button
                key={n.id}
                onClick={()=>setSelected(n)}
                className="
                  bg-white dark:bg-slate-900
                  rounded-2xl p-4
                  border border-slate-100 dark:border-slate-800
                  shadow-sm
                  text-left
                  active:scale-95
                "
              >
                <div className="text-lg">🕌</div>
                <h3 className="font-bold text-sm mt-2">
                  Nabi {n.name}
                </h3>
                <p className="text-[10px] text-slate-500">
                  {n.short}
                </p>
              </button>
            ))}

          </div>

        </>
      )}

      {selected && (

        <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow border">

          <h2 className="text-xl font-bold mb-3">
            Nabi {selected.name}
          </h2>

          <p className="text-sm leading-relaxed text-justify">
            {mode==="child" ? selected.child : selected.adult}
          </p>

          {selected.audio && (
            <audio controls className="w-full mt-4">
              <source src={selected.audio} />
            </audio>
          )}

        </div>
      )}

    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>

</body>
</html>
