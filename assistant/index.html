<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Islamic Assistant</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
html,body{
 height:100%;
 margin:0;
}
body{
 font-family:system-ui;
 overflow:hidden;
 background:#f1f5f9;
}
:root{
 --vh:1vh;
}
.app-root{
 height:calc(var(--vh) * 100);
 display:flex;
 overflow:hidden;
}
</style>
</head>

<body>

<script>
/* ================= CONFIG ================= */

const API="https://noorrahma-app.pembang001.workers.dev";

let UID = localStorage.getItem("nr_uid");
if(!UID){
 UID="uid-"+Date.now();
 localStorage.setItem("nr_uid",UID);
}

if(localStorage.getItem("nr_is_pro")!=="1"){
 alert("Fitur PRO 🔒");
 location.href="/";
}

/* ================= MULTI CHAT SYSTEM ================= */

let chats = JSON.parse(localStorage.getItem("nr_ai_chats")||"[]");
let currentChatId=null;

function saveChats(){
 localStorage.setItem("nr_ai_chats",JSON.stringify(chats));
}

function createNewChat(){
 const id="sess-"+Date.now();
 const newChat={
  id,
  title:"Chat Baru",
  messages:[]
 };
 chats.unshift(newChat);
 currentChatId=id;
 saveChats();
 renderSidebar();
 renderMessages();
}

function getCurrentChat(){
 return chats.find(c=>c.id===currentChatId);
}

function renderSidebar(){
 const list=document.getElementById("chatList");
 list.innerHTML="";
 chats.forEach(chat=>{
  const item=document.createElement("div");
  item.className="p-3 rounded-lg cursor-pointer hover:bg-slate-700 text-sm truncate";
  item.innerText=chat.title;
  item.onclick=()=>{
   currentChatId=chat.id;
   renderMessages();
  };
  list.appendChild(item);
 });
}

function renderMessages(){
 chatWrap.innerHTML="";
 const chat=getCurrentChat();
 if(!chat)return;
 chat.messages.forEach(m=>bubble(m.text,m.role));
}

/* ================= FIX ANDROID HEIGHT ================= */

function setVH(){
 const vh = window.innerHeight * 0.01;
 document.documentElement.style.setProperty('--vh', `${vh}px`);
}
setVH();
window.addEventListener("resize",setVH);
</script>

<div class="app-root">

<!-- SIDEBAR -->
<aside class="w-72 bg-slate-900 text-white flex flex-col shrink-0">

<div class="p-4 border-b border-slate-700">
<button onclick="createNewChat()"
class="w-full bg-emerald-600 py-2 rounded-xl font-semibold">
+ Chat Baru
</button>
</div>

<div id="chatList"
class="flex-1 overflow-y-auto p-2 space-y-2">
</div>

</aside>

<!-- MAIN -->
<div class="flex-1 flex flex-col">

<header class="bg-emerald-700 text-white p-4 flex items-center gap-3 shrink-0">
<h2 class="font-bold">Smart Islamic Assistant</h2>
</header>

<div id="chatWrap"
class="flex-1 overflow-y-auto px-4 py-4 space-y-4 bg-slate-50 overscroll-contain"></div>

<div class="px-4 py-2 flex gap-2 overflow-x-auto shrink-0 bg-slate-100">
<button onclick="sendQuick('Waktu shalat hari ini')" class="bg-emerald-600 text-white px-4 py-2 rounded-full text-xs whitespace-nowrap">🕌 Waktu shalat</button>
<button onclick="sendQuick('Doa harian')" class="bg-emerald-600 text-white px-4 py-2 rounded-full text-xs whitespace-nowrap">🤲 Doa</button>
<button onclick="sendQuick('Puasa sunnah')" class="bg-emerald-600 text-white px-4 py-2 rounded-full text-xs whitespace-nowrap">🌙 Puasa</button>
<button onclick="sendQuick('Tafsir ayat')" class="bg-emerald-600 text-white px-4 py-2 rounded-full text-xs whitespace-nowrap">📖 Tafsir</button>
</div>

<div class="bg-white p-3 flex gap-2 items-center border-t shrink-0">

<button onclick="startVoice()" class="text-xl">🎙️</button>

<input id="input"
placeholder="Tanya tentang ibadah..."
class="flex-1 border rounded-xl px-4 py-2 text-sm">

<button onclick="sendMessage()"
class="bg-emerald-600 text-white px-5 py-2 rounded-xl font-bold">
Kirim
</button>

</div>

</div>
</div>

<script>
const chatWrap=document.getElementById("chatWrap");

let recognizing=false;
let recog;

/* ================= BUBBLE (ASLI TIDAK DIUBAH) ================= */

function bubble(text,role){

 const wrap=document.createElement("div");

 wrap.className=
  role==="user"
   ?"flex justify-end"
   :"flex justify-start gap-2";

 if(role==="assistant"){
   const img=document.createElement("img");
   img.src="/assistant/bot.png";
   img.className="w-9 h-9 rounded-full shrink-0";
   wrap.appendChild(img);
 }

 const box=document.createElement("div");

 box.className=
  role==="user"
   ?"bg-emerald-600 text-white px-4 py-3 rounded-2xl max-w-[85%] leading-relaxed text-sm"
   :"bg-white px-4 py-3 rounded-2xl shadow max-w-[85%] leading-relaxed text-sm";

 box.innerText=text;
 box.style.whiteSpace="pre-line";

 wrap.appendChild(box);
 chatWrap.appendChild(wrap);
 chatWrap.scrollTop=chatWrap.scrollHeight;
}

/* ================= PUSH MESSAGE (DISESUAIKAN MULTI CHAT) ================= */

function push(role,text){
 const chat=getCurrentChat();
 if(!chat)return;

 chat.messages.push({role,text});

 if(role==="user" && chat.messages.length===1){
  chat.title=text.substring(0,25);
 }

 saveChats();
 renderSidebar();
 bubble(text,role);
}

/* ================= SEND ================= */

function sendMessage(){
 const input=document.getElementById("input");
 const text=input.value.trim();
 if(!text)return;
 input.value="";
 push("user",text);
 fetchAnswer(text);
}

function sendQuick(t){
 push("user",t);
 fetchAnswer(t);
}

/* ================= BACKEND (ASLI) ================= */

async function fetchAnswer(q){

 const loadingBubble=bubble("⏳ Memproses...","assistant");

 try{
  const r=await fetch(API+"/assistant/ai",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      uid:UID,
      prompt:q,
      sessionId:currentChatId
    })
  });

  const d=await r.json();

  renderMessages();
  if(d.error){
    push("assistant","⚠️ "+d.error);
  }else{
    push("assistant",d.answer||"⚠️ Tidak ada jawaban.");
  }

 }catch(err){
  push("assistant","⚠️ AI gagal dipanggil.");
 }
}

/* ================= VOICE (ASLI) ================= */

function startVoice(){
 if(recognizing)return;

 const SpeechRecognition=
  window.SpeechRecognition||window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  alert("Voice tidak didukung");
  return;
 }

 recog=new SpeechRecognition();
 recog.lang="id-ID";
 recog.interimResults=false;

 recognizing=true;
 recog.start();

 recog.onresult=e=>{
  const t=e.results[0][0].transcript;
  document.getElementById("input").value=t;
 };

 recog.onend=()=>recognizing=false;
}

/* ================= INIT ================= */

if(chats.length===0){
 createNewChat();
}else{
 createNewChat(); // selalu buka tab baru seperti ChatGPT
 renderSidebar();
}
</script>

</body>
</html>
