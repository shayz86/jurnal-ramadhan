<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Islamic Assistant</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{font-family:system-ui}

/* bubble animation */
.msg-enter {
  animation: pop .25s ease-out both;
}

@keyframes pop {
  from {
    opacity: 0;
    transform: translateY(6px) scale(.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* avatar */
.bot-avatar {
  width: 36px;
  height: 36px;
  border-radius: 9999px;
  object-fit: cover;
}
</style>
</head>

<body class="bg-slate-100 h-screen">

<script>
/* ================= CONFIG ================= */

const API="https://noorrahma-app.pembang001.workers.dev";

/* UID */
let UID = localStorage.getItem("nr_uid");
if(!UID){
 UID="uid-"+Date.now();
 localStorage.setItem("nr_uid",UID);
}

/* Session */
let sessionId=localStorage.getItem("nr_ai_session");

/* ================= PRO GUARD ================= */

if(localStorage.getItem("nr_is_pro")!=="1"){
 alert("Fitur PRO 🔒");
 location.href="/";
}

/* session baru jika belum ada */
if(!sessionId){
 sessionId="sess-"+Date.now();
 localStorage.setItem("nr_ai_session",sessionId);
}
</script>

<!-- ROOT -->
<div class="h-screen flex flex-col overflow-hidden">

<!-- HEADER -->
<header class="bg-emerald-700 text-white p-4 flex items-center gap-3 shrink-0">
<button onclick="history.back()">←</button>
<h2 class="font-bold">Smart Islamic Assistant</h2>
</header>

<!-- ============ SESSION MODAL ============ -->

<div id="sessionModal"
class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">

<div class="bg-white rounded-2xl p-6 w-[90%] max-w-sm space-y-4">

<h3 class="font-bold text-lg">Mulai Percakapan</h3>

<button onclick="resumeChat()"
class="w-full bg-emerald-600 text-white py-3 rounded-xl">
Lanjut Chat Terakhir
</button>

<button onclick="newChat()"
class="w-full border py-3 rounded-xl">
Chat Baru
</button>

</div>
</div>

<!-- ============ CHAT AREA ============ -->

<div id="chatWrap"
class="flex-1 overflow-y-auto px-4 py-4 space-y-4 bg-slate-50 hidden overscroll-contain"></div>

<!-- ============ QUICK BUTTONS ============ -->

<div class="px-4 py-2 flex gap-2 overflow-x-auto shrink-0 bg-slate-100">
<button onclick="sendQuick('Waktu shalat hari ini')" class="bg-emerald-600 text-white px-4 py-2 rounded-full text-xs whitespace-nowrap">🕌 Waktu shalat</button>
<button onclick="sendQuick('Doa harian')" class="bg-emerald-600 text-white px-4 py-2 rounded-full text-xs whitespace-nowrap">🤲 Doa</button>
<button onclick="sendQuick('Puasa sunnah')" class="bg-emerald-600 text-white px-4 py-2 rounded-full text-xs whitespace-nowrap">🌙 Puasa</button>
<button onclick="sendQuick('Tafsir ayat')" class="bg-emerald-600 text-white px-4 py-2 rounded-full text-xs whitespace-nowrap">📖 Tafsir</button>
</div>

<!-- ============ INPUT BAR ============ -->

<div class="bg-white p-3 flex gap-2 items-center border-t shrink-0">

<button onclick="startVoice()" class="text-xl">🎙️</button>

<input id="input"
placeholder="Tanya tentang ibadah..."
class="flex-1 border rounded-xl px-4 py-2 text-sm">

<button onclick="sendMessage()"
class="bg-emerald-600 text-white px-5 py-2 rounded-xl font-bold">
Kirim
</button>

</div>

</div>

<script>
/* ================= STATE ================= */

const chatWrap=document.getElementById("chatWrap");
const modal=document.getElementById("sessionModal");

let history=JSON.parse(localStorage.getItem("nr_ai_history")||"[]");
let bookmarks=JSON.parse(localStorage.getItem("nr_ai_bookmarks")||"[]");

let recognizing=false;
let recog;

/* ================= SESSION ================= */

if(history.length){
 modal.classList.remove("hidden");
}else{
 chatWrap.classList.remove("hidden");

 const intro =
 "👋 Assalamu’alaikum!\n\n" +
 "Saya Smart Islamic Assistant.\n\n" +
 "Silakan tanya:\n" +
 "• 🕌 Waktu shalat\n" +
 "• 🤲 Doa\n" +
 "• 🌙 Puasa\n" +
 "• 📖 Tafsir\n\n" +
 "Apa yang ingin Anda ketahui hari ini?";

 history.push({ role:"assistant", text:intro });
 localStorage.setItem("nr_ai_history",JSON.stringify(history));
 bubble(intro,"assistant");
}

/* ================= UI ================= */

function resumeChat(){
 modal.classList.add("hidden");
 chatWrap.classList.remove("hidden");
 renderHistory();
}

function newChat(){

 history=[];
 sessionId="sess-"+Date.now();

 localStorage.setItem("nr_ai_session",sessionId);
 localStorage.removeItem("nr_ai_history");

 modal.classList.add("hidden");
 chatWrap.classList.remove("hidden");
 chatWrap.innerHTML="";

 const intro =
 "👋 Assalamu’alaikum!\n\n" +
 "Saya Smart Islamic Assistant.\n\n" +
 "Silakan tanya tentang ibadah 🙏";

 history.push({ role:"assistant", text:intro });
 localStorage.setItem("nr_ai_history",JSON.stringify(history));
 bubble(intro,"assistant");
}

/* ================= RENDER ================= */

function bubble(text,role,loading=false){

 const wrap=document.createElement("div");

 wrap.className=
  role==="user"
   ?"flex justify-end msg-enter"
   :"flex items-end gap-2 msg-enter";

 const box=document.createElement("div");

 box.className=
  role==="user"
   ?"bg-emerald-600 text-white px-4 py-3 rounded-2xl max-w-[85%] leading-relaxed text-sm"
   :"bg-white px-4 py-3 rounded-2xl shadow max-w-[80%] leading-relaxed text-sm";

 box.innerText=text;
 box.style.whiteSpace="pre-line";

 /* ===== avatar bot ===== */

 if(role==="assistant"){

   const avatar=document.createElement("img");
   avatar.src="/assistant/bot.png";
   avatar.className="bot-avatar";

   wrap.appendChild(avatar);
 }

 wrap.appendChild(box);

 if(role==="assistant" && !loading){

  const tools=document.createElement("div");
  tools.className="flex gap-3 mt-1 text-xs opacity-50";

  const bm=document.createElement("button");
  bm.textContent="🔖";
  bm.onclick=()=>bookmark(text);

  const sh=document.createElement("button");
  sh.textContent="📤";
  sh.onclick=()=>share(text);

  tools.append(bm,sh);

  const toolsWrap=document.createElement("div");
  toolsWrap.append(box,tools);

  if(role==="assistant"){
    wrap.replaceChild(toolsWrap,box);
  }
 }

 chatWrap.appendChild(wrap);
 chatWrap.scrollTop=chatWrap.scrollHeight;

 return wrap;
}

 const wrap=document.createElement("div");

 wrap.className=
  role==="user"
   ?"flex justify-end"
   :"flex justify-start";

 const box=document.createElement("div");

 box.className=
  role==="user"
   ?"bg-emerald-600 text-white px-4 py-3 rounded-2xl max-w-[85%] leading-relaxed text-sm"
   :"bg-white px-4 py-3 rounded-2xl shadow max-w-[85%] leading-relaxed text-sm";

 box.innerText=text;
 box.style.whiteSpace="pre-line";

 wrap.appendChild(box);

 if(role==="assistant" && !loading){

  const tools=document.createElement("div");
  tools.className="flex gap-3 mt-2 text-xs opacity-60";

  const bm=document.createElement("button");
  bm.textContent="🔖";
  bm.onclick=()=>bookmark(text);

  const sh=document.createElement("button");
  sh.textContent="📤";
  sh.onclick=()=>share(text);

  tools.append(bm,sh);
  wrap.appendChild(tools);
 }

 chatWrap.appendChild(wrap);
 chatWrap.scrollTop=chatWrap.scrollHeight;

 return wrap;
}

/* ================= SEND ================= */

function sendMessage(){

 const input=document.getElementById("input");
 const text=input.value.trim();
 if(!text)return;

 input.value="";

 push("user",text);
 fetchAnswer(text);
}

function sendQuick(t){
 push("user",t);
 fetchAnswer(t);
}

function push(role,text){

 history.push({role,text});
 localStorage.setItem("nr_ai_history",JSON.stringify(history));
 bubble(text,role);
}

/* ================= BACKEND ================= */

async function fetchAnswer(q){

 const loadingBubble=bubble("⏳ Memproses...","assistant",true);

 try{

  const r=await fetch(API+"/assistant/ai",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      uid:UID,
      prompt:q,
      sessionId
    })
  });

  const d=await r.json();

  loadingBubble.remove();

  if(d.error){
    push("assistant","⚠️ "+d.error);
  }else{
    push("assistant",d.answer||"⚠️ Tidak ada jawaban.");
  }

 }catch(err){

  console.error(err);
  loadingBubble.remove();
  push("assistant","⚠️ AI gagal dipanggil.");
 }
}
</script>

</body>
</html>
